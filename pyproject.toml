[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dds-v2"
version = "2.1.0"
description = "DDS v2 - Data-driven real estate decision report engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.35,<1",
]


[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
    "duckdb>=1,<2",
    "httpx>=0.28,<1",
]
[project.optional-dependencies]
data = [
    "duckdb>=1.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dds*"]

[tool.setuptools.package-data]
"dds.reporting" = ["templates/*.html", "profiles/*.json"]
"dds.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise a representative cross-module data slice",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

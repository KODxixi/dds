<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080b0a">
    <meta name="color-scheme" content="dark">
    <title>DDS 空间研判</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23d47155' d='M32 4 60 32 32 60 4 32Z'/%3E%3Cpath fill='%23080b0a' d='M32 18 46 32 32 46 18 32Z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/dds/vendor/cesium/Widgets/widgets.css">
    <link rel="stylesheet" href="/dds/assets/styles/app-v2.css?v=20260714-2">
    <script>window.CESIUM_BASE_URL = "/dds/vendor/cesium/";</script>
    <script src="/dds/vendor/cesium/Cesium.js"></script>
  </head>
  <body class="map-workspace-page">
    <div id="decisionFieldRoot" class="decision-field map-workspace" data-surface="map" data-state="locating">
      <header class="field-topbar" aria-label="项目与地图状态">
        <a class="field-brand" href="/dds/" aria-label="返回 DDS Hero">
          <span class="field-brand__mark" aria-hidden="true"></span>
          <span>DDS</span>
          <span class="field-brand__mode">Spatial Review</span>
        </a>
        <div class="project-identity" aria-live="polite">
          <span class="project-identity__label">空间研判</span>
          <strong id="projectName">正在定位项目</strong>
        </div>
        <div class="field-statuses">
          <span id="dataStatus" class="status-signal" data-tone="neutral"><span class="status-signal__dot" aria-hidden="true"></span><span>连接数据源</span></span>
          <span id="sceneMode" class="scene-mode">地图准备中</span>
          <button class="icon-button" type="button" data-action="toggle-drawer" aria-label="项目进程" aria-expanded="false" aria-controls="taskDrawer" title="项目进程">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"></path></svg>
          </button>
        </div>
      </header>

      <main id="sceneFrame" class="scene-frame" aria-label="高德三维空间研判地图">
        <div id="cesiumContainer" class="scene-canvas" aria-label="空间地图"></div>
        <canvas id="fallbackCanvas" class="fallback-map" aria-label="二维地图降级视图" hidden></canvas>
        <div class="scene-vignette" aria-hidden="true"></div>
        <div class="scene-readout" aria-live="polite"><span id="coordinateReadout">N/A</span><span id="qualityReadout">BALANCED</span></div>

        <section class="map-commandbar" aria-label="地图视图控制">
          <div class="map-commandbar__group" role="group" aria-label="地图维度">
            <button type="button" data-map-mode="3d" aria-pressed="true">3D 城市</button>
            <button type="button" data-map-mode="2d" aria-pressed="false">2D 分析</button>
          </div>
          <div class="map-commandbar__group" role="group" aria-label="地图样式">
            <button type="button" data-map-theme="dds" aria-pressed="true">DDS</button>
            <button type="button" data-map-theme="grey" aria-pressed="false">灰阶</button>
            <button type="button" data-map-theme="satellite" aria-pressed="false">卫星</button>
          </div>
          <div class="map-commandbar__group map-commandbar__measure" role="group" aria-label="量测工具">
            <button type="button" data-map-tool="distance" aria-pressed="false">测距</button>
            <button type="button" data-map-tool="area" aria-pressed="false">面积</button>
            <button type="button" data-map-tool="clear">清除</button>
          </div>
        </section>

        <nav class="map-topic-rail" aria-label="空间专题">
          <button type="button" data-map-topic="overview" aria-current="true"><span>总览</span><small>场地与样本</small></button>
          <button type="button" data-map-topic="site"><span>区位</span><small>地址与行政区</small></button>
          <button type="button" data-map-topic="competitors"><span>竞品</span><small>价格与产品</small></button>
          <button type="button" data-map-topic="resources"><span>配套</span><small>POI 与路线</small></button>
          <button type="button" data-map-topic="buildings"><span>建筑</span><small>真实边界着色</small></button>
          <button type="button" data-map-topic="risks"><span>风险</span><small>约束与缺口</small></button>
        </nav>

        <aside id="mapDataPanel" class="map-data-panel" aria-label="空间数据详情" aria-hidden="false">
          <header>
            <div><span id="mapPanelStatus">项目数据</span><strong id="mapPanelTitle">空间总览</strong></div>
            <button type="button" data-map-panel="close" aria-label="收起空间数据">×</button>
          </header>
          <div id="mapPanelBody" class="map-data-panel__body" aria-live="polite"></div>
          <div id="mapPoiControls" class="map-poi-controls" hidden>
            <button type="button" data-poi-category="transit" aria-pressed="true">交通</button>
            <button type="button" data-poi-category="education" aria-pressed="false">教育</button>
            <button type="button" data-poi-category="medical" aria-pressed="false">医疗</button>
            <button type="button" data-poi-category="retail" aria-pressed="false">商业</button>
            <button type="button" data-poi-category="park" aria-pressed="false">公园</button>
          </div>
        </aside>
        <button type="button" class="map-data-panel-open" data-map-panel="open" aria-label="展开空间数据">数据</button>

        <div id="layerMenu" class="scene-menu" hidden>
          <div class="scene-menu__heading">证据图层</div>
          <label><input type="checkbox" data-layer="parcel" checked> 地块与范围</label>
          <label><input type="checkbox" data-layer="competitors" checked> 竞品</label>
          <label><input type="checkbox" data-layer="resources" checked> 城市资源</label>
          <label><input type="checkbox" data-layer="risks"> 风险与缺口</label>
        </div>
        <div id="qualityMenu" class="scene-menu scene-menu--quality" hidden>
          <div class="scene-menu__heading">渲染质量</div>
          <button type="button" data-quality="high">高质量 <span>独显 / 大屏</span></button>
          <button type="button" data-quality="balanced" aria-current="true">平衡 <span>默认</span></button>
          <button type="button" data-quality="low">低负载 <span>移动端</span></button>
        </div>
      </main>

      <aside id="taskDrawer" class="task-drawer" aria-label="项目进程" aria-hidden="true">
        <header class="task-drawer__header"><div><span class="eyebrow">PROJECT SESSION</span><h2>研判进程</h2></div><button class="icon-button" type="button" data-action="close-drawer" aria-label="关闭项目进程"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></header>
        <div id="taskSummary" class="task-summary"><p>地块确认后开始建立项目任务书。</p></div>
        <div class="drawer-scene-tools"><button type="button" class="text-button" data-action="return-site">返回地块</button><button type="button" class="text-button" data-action="toggle-quality">场景质量</button></div>
        <ol id="taskStages" class="task-stages" aria-label="分析阶段"></ol>
        <section class="recent-projects" aria-labelledby="recentProjectsTitle"><h3 id="recentProjectsTitle">最近项目</h3><div id="recentProjects" class="recent-projects__list"></div></section>
      </aside>

      <div id="interactionStack" class="interaction-stack map-agent-stack">
        <section id="agentCue" class="agent-cue" aria-live="polite"><span class="agent-cue__label">Agent</span><p id="agentCueText">核对位置并补齐项目条件。</p></section>
        <section id="contextPanel" class="context-panel" aria-live="polite" hidden></section>
        <section id="decisionBar" class="decision-bar" aria-labelledby="decisionTitle" hidden>
          <div class="decision-bar__verdict"><span id="decisionTitle" class="eyebrow">联席判断</span><strong id="decisionVerdict">等待结论</strong></div>
          <div class="decision-bar__metric"><span>置信度</span><strong id="decisionConfidence">N/A</strong></div>
          <div class="decision-bar__metric"><span>待补证据</span><strong id="decisionGaps">0</strong></div>
          <div class="decision-bar__actions"><button type="button" class="text-button" data-action="continue-questions">继续追问</button><button type="button" class="primary-button" data-action="open-report">打开报告</button></div>
        </section>
        <form id="locationDock" class="location-dock" novalidate>
          <div class="dock-context"><span id="dockMode" class="dock-context__mode">确认</span><span id="dockHint" class="dock-context__hint">地址 / 坐标 / 回答</span></div>
          <label class="visually-hidden" for="commandInput">输入地址、坐标或回答</label>
          <div class="dock-input-wrap"><svg class="dock-input-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="commandInput" name="command" type="text" inputmode="search" autocomplete="off" maxlength="500" placeholder="输入地址、坐标或回答"><button id="dockSecondary" class="dock-secondary" type="button" data-action="secondary" hidden>取消</button><button id="dockSubmit" class="dock-submit" type="submit" aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></div>
        </form>
      </div>
      <div id="liveRegion" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <noscript>需要启用 JavaScript 才能使用 DDS 空间研判。</noscript>
    <script type="module" src="/dds/assets/js/main.js?v=20260714-2"></script>
  </body>
</html>

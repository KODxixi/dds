<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base href="/reports/interactive/dds-earth-hero-demos/">

  <title>Digital Decision System | 地产决策入口</title>
  <script>
    (function () {
      var embed = new URLSearchParams(window.location.search).get("embed") || "";
      if (!embed) return;
      document.documentElement.dataset.embed = embed;
      document.addEventListener("DOMContentLoaded", function () {
        ["reportForm", "formStatus", "toast", "navRevealPanel"].forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          el.hidden = true;
          el.style.setProperty("display", "none", "important");
          el.style.setProperty("visibility", "hidden", "important");
          el.style.setProperty("pointer-events", "none", "important");
        });
        document.querySelectorAll(".liquid-nav,.coordinate-console,.nav-reveal-panel,.toast").forEach(function (el) {
          el.hidden = true;
          el.style.setProperty("display", "none", "important");
          el.style.setProperty("visibility", "hidden", "important");
          el.style.setProperty("pointer-events", "none", "important");
        });
      });
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2303060a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f6f8ff' fill-opacity='.8'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #020306;
      --ink: rgba(250, 250, 246, .95);
      --muted: rgba(250, 250, 246, .58);
      --line: rgba(255, 255, 255, .13);
      --line-strong: rgba(255, 255, 255, .28);
      --glass: rgba(6, 8, 13, .62);
      --gold: #d8c083;
      --mint: #8fe1bd;
      --blue: #8cc7ff;
      --danger: #ee806c;
      --shadow: 0 28px 90px rgba(0, 0, 0, .52), inset 0 1px 0 rgba(255, 255, 255, .12);
      font-family: "SF Pro SC", "PingFang SC", "Microsoft YaHei UI", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); letter-spacing: 0; }
    body { overflow: hidden; }
    button, input, select, textarea { font: inherit; }

    .hero-shell {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #000;
    }

    .hero-shell::before,
    .hero-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .hero-shell::before {
      background:
        radial-gradient(circle at 50% 42%, rgba(50, 115, 255, .18), transparent 30%),
        linear-gradient(180deg, rgba(0, 0, 0, .05), rgba(0, 0, 0, .72));
    }

    .hero-shell::after {
      opacity: .24;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .014) 0 1px, transparent 1px 6px);
      mix-blend-mode: screen;
    }

    .globe-card {
      position: relative;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      background: #000;
    }


    .globe-card::before {
      content: "";
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      top: 0;
      height: min(32vh, 250px);
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,.34) 48%, rgba(0,0,0,0));
    }    .hero-copy {
      position: absolute;
      z-index: 6;
      left: 0;
      right: 0;
      top: 0;
      display: grid;
      justify-items: center;
      gap: 16px;
      padding-top: clamp(30px, 4.4vh, 52px);
      text-align: center;
      pointer-events: none;
    }

    .access-badge {
      display: inline-block;
      width: fit-content;
      border: 1px solid #3273ff;
      border-radius: 999px;
      background: #0f1c35;
      color: rgba(237, 239, 253, .92);
      padding: 4px 12px;
      font-size: 13px;
      line-height: 1.2;
      box-shadow: 0 0 32px rgba(50, 115, 255, .22), inset 0 1px 0 rgba(255, 255, 255, .1);
    }

    .master-title {
      margin: 0;
      max-width: min(1120px, calc(100vw - 48px));
      text-align: center;
      font-size: clamp(34px, 3.2vw, 52px);
      line-height: 1;
      font-weight: 650;
      letter-spacing: 0;
      color: transparent;
      background: linear-gradient(180deg, #edeffd 0%, #7b9cda 100%);
      -webkit-background-clip: text;
      background-clip: text;
      text-wrap: balance;
    }

    canvas {
      position: absolute;
      display: block;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #starfieldCanvas {
      z-index: 0;
    }

    #earthCanvas,
    #globeFxCanvas {
      inset: auto;
      left: 50%;
      top: 50%;
      width: min(70vw, 800px, 80vh);
      height: min(70vw, 800px, 80vh);
      transform: translate(-50%, -50%);
    }

    #earthCanvas {
      z-index: 2;
      cursor: pointer;
      touch-action: manipulation;
      filter: saturate(1.08) contrast(1.04) drop-shadow(0 0 24px rgba(91, 161, 255, .2));
    }

    #globeFxCanvas {
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: screen;
      filter: blur(.12px) saturate(1.08);
    }

    .sparkle-horizon {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: -7vh;
      width: 100vw;
      height: min(38vh, 340px);
      transform: translateX(-50%);
      overflow: hidden;
      pointer-events: none;
      mask-image: radial-gradient(50% 50% at 50% 50%, white 0 44%, transparent 86%);
      -webkit-mask-image: radial-gradient(50% 50% at 50% 50%, white 0 44%, transparent 86%);
    }

    .sparkle-horizon::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at bottom center, rgba(50, 115, 255, .86), transparent 68%),
        radial-gradient(circle at 50% 74%, rgba(123, 156, 218, .22), transparent 42%);
      opacity: .44;
    }

    .sparkle-horizon::after {
      content: "";
      position: absolute;
      left: -50%;
      top: 50%;
      width: 200%;
      aspect-ratio: 1 / .7;
      border-radius: 10%;
      border-top: 1px solid #163474;
      background: #08132b;
      box-shadow: 0 -40px 120px rgba(50, 115, 255, .22);
    }

    .sparkle-field {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle, rgba(237, 239, 253, .85) 0 1px, transparent 1.4px) 0 0 / 21px 21px,
        radial-gradient(circle, rgba(123, 156, 218, .9) 0 1px, transparent 1.5px) 8px 14px / 31px 31px,
        radial-gradient(circle, rgba(50, 115, 255, .9) 0 1.2px, transparent 1.7px) 18px 4px / 47px 47px;
      opacity: .46;
      transform: translateY(18px);
      animation: sparkleDrift 9s linear infinite;
    }

    @keyframes sparkleDrift {
      from { transform: translate3d(0, 18px, 0); }
      to { transform: translate3d(-47px, 18px, 0); }
    }
    .sparkle-horizon {
      display: none !important;
    }

    .coordinate-console {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 28px;
      width: min(900px, calc(100% - 80px));
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 108px minmax(260px, 1fr) minmax(300px, 1fr) 84px;
      gap: 6px;
      padding: 10px;
      border-radius: 22px;
      border: 1px solid var(--line);
      border-top-color: var(--line-strong);
      background: linear-gradient(135deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .045)), rgba(5, 7, 12, .68);
      box-shadow: 0 22px 72px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .12);
      backdrop-filter: blur(22px) saturate(1.12);
      -webkit-backdrop-filter: blur(22px) saturate(1.12);
      transition: transform .24s cubic-bezier(.32, .72, 0, 1), border-color .24s, background .24s;
    }

    html[data-variant="texture"] .coordinate-console {
      width: min(900px, calc(100% - 80px));
      border-color: rgba(255, 255, 255, .14);
      border-top-color: rgba(255, 255, 255, .32);
      background: linear-gradient(135deg, rgba(255, 255, 255, .105), rgba(255, 255, 255, .04)), rgba(4, 6, 10, .70);
    }

    html[data-variant="radar"] .coordinate-console {
      width: min(900px, calc(100% - 80px));
      border-color: rgba(142, 225, 189, .16);
      border-top-color: rgba(142, 225, 189, .36);
      background: linear-gradient(135deg, rgba(142, 225, 189, .1), rgba(255, 255, 255, .035)), rgba(4, 10, 12, .66);
    }

    html[data-variant="silent"] .coordinate-console {
      width: min(900px, calc(100% - 80px));
      border-color: rgba(216, 192, 131, .13);
      border-top-color: rgba(216, 192, 131, .34);
      background: linear-gradient(135deg, rgba(216, 192, 131, .09), rgba(255, 255, 255, .035)), rgba(4, 4, 5, .72);
    }

    .coordinate-console:focus-within {
      border-color: rgba(216, 192, 131, .42);
      transform: translateX(-50%) translateY(-2px);
    }

    .coordinate-console.running {
      border-color: rgba(142, 225, 189, .48);
    }

    .coordinate-console.done {
      border-color: rgba(216, 192, 131, .52);
    }

    .coordinate-console.error {
      border-color: rgba(238, 128, 108, .62);
      animation: shake .28s ease both;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(-50%); }
      25% { transform: translateX(calc(-50% - 8px)); }
      75% { transform: translateX(calc(-50% + 8px)); }
    }

    select,
    input,
    textarea,
    button {
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, .11);
      color: var(--ink);
      background: rgba(0, 0, 0, .26);
      outline: none;
      border-radius: 14px;
    }

    select,
    input {
      height: 52px;
      padding: 0 12px;
    }

    select {
      appearance: none;
      cursor: pointer;
      color: rgba(250, 250, 246, .78);
      background:
        linear-gradient(45deg, transparent 50%, rgba(250, 250, 246, .72) 50%) calc(100% - 16px) 22px / 6px 6px no-repeat,
        linear-gradient(135deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .025)),
        rgba(0, 0, 0, .26);
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(250, 250, 246, .38);
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(216, 192, 131, .46);
      box-shadow: 0 0 0 4px rgba(216, 192, 131, .08);
    }

    textarea {
      grid-column: 3;
      grid-row: 1;
      min-height: 52px;
      max-height: 52px;
      resize: none;
      padding: 13px 14px;
      line-height: 1.35;
    }

    html[data-variant="silent"] textarea {
      display: none;
    }

    button {
      height: 52px;
      cursor: pointer;
      font-weight: 850;
      border-top-color: rgba(255, 255, 255, .28);
      background: linear-gradient(135deg, rgba(216, 192, 131, .96), rgba(255, 255, 255, .32));
      color: #050604;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 14px 34px rgba(0, 0, 0, .28);
    }

    #submitBtn {
      grid-column: 4;
      grid-row: 1;
    }

    html[data-variant="texture"] button {
      background: linear-gradient(135deg, rgba(244, 239, 221, .94), rgba(216, 192, 131, .36));
      color: #050604;
    }

    html[data-variant="radar"] button {
      background: linear-gradient(135deg, rgba(142, 225, 189, .96), rgba(255, 255, 255, .28));
      color: #03100b;
    }

    button:disabled {
      opacity: .54;
      cursor: wait;
    }

    .status-line {
      position: absolute;
      left: 50%;
      top: -12px;
      width: 72px;
      height: 3px;
      transform: translateX(-50%);
      border-radius: 999px;
      overflow: hidden;
      background: transparent;
      color: transparent;
      pointer-events: none;
    }

    .coordinate-console.running .status-line {
      background: rgba(255, 255, 255, .1);
    }

    .coordinate-console.running .status-line::before {
      content: "";
      display: block;
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--mint), transparent);
      animation: loading 1s linear infinite;
    }

    @keyframes loading {
      from { transform: translateX(-130%); }
      to { transform: translateX(280%); }
    }

    .toast {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: calc(max(22px, env(safe-area-inset-bottom)) + 124px);
      max-width: min(520px, calc(100vw - 32px));
      transform: translateX(-50%) translateY(12px);
      opacity: 0;
      pointer-events: none;
      border-radius: 999px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(0, 0, 0, .66);
      color: rgba(250, 250, 246, .84);
      box-shadow: 0 18px 54px rgba(0, 0, 0, .4);
      backdrop-filter: blur(18px);
      transition: opacity .22s, transform .22s;
      font-size: 13px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @media (max-width: 760px) {
      .hero-shell {
        padding: 8px;
      }

      .globe-card {
        width: calc(100vw - 16px);
        height: calc(100svh - 16px);
        min-height: 620px;
        aspect-ratio: auto;
        border-radius: 12px;
      }

      .master-title {
        top: 24px;
        width: calc(100% - 14px);
        font-size: clamp(30px, 9.2vw, 40px);
        line-height: .9;
      }

      .coordinate-console,
      html[data-variant="texture"] .coordinate-console,
      html[data-variant="radar"] .coordinate-console,
      html[data-variant="silent"] .coordinate-console {
        width: min(100% - 18px, 456px);
        bottom: max(10px, env(safe-area-inset-bottom));
        grid-template-columns: 82px minmax(0, 1fr) 58px;
        gap: 7px;
        padding: 8px;
        border-radius: 18px;
      }

      select,
      input,
      #submitBtn {
        height: 44px;
        border-radius: 16px;
      }

      input,
      select {
        padding: 0 11px;
      }

      #vision {
        grid-column: 1 / -1;
        grid-row: auto;
        min-height: 38px;
        max-height: 58px;
        padding: 10px 12px;
      }

      #submitBtn {
        grid-column: 3;
        grid-row: 1;
      }

      #submitBtn span {
        display: none;
      }

      #submitBtn::before {
        content: ">";
        font-size: 18px;
        line-height: 1;
      }
    }

    @media (max-width: 430px) {
      .coordinate-console,
      html[data-variant="texture"] .coordinate-console,
      html[data-variant="radar"] .coordinate-console,
      html[data-variant="silent"] .coordinate-console {
        grid-template-columns: 76px minmax(0, 1fr) 52px;
      }

      .master-title {
        font-size: clamp(28px, 8.6vw, 36px);
      }
    }

    /* DDS hero title: no backing glass, just centered cinematic type over the globe. */
    .hero-copy {
      display: grid !important;
      position: absolute;
      z-index: 6;
      left: 50%;
      right: auto;
      top: clamp(34px, 5.2vh, 58px);
      width: min(1080px, calc(100vw - 48px));
      transform: translateX(-50%);
      justify-items: center;
      gap: 10px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      text-align: center;
      pointer-events: none;
    }

    .access-badge {
      display: none !important;
    }

    .master-title {
      margin: 0;
      max-width: none;
      font-size: clamp(42px, 5.1vw, 86px);
      line-height: .94;
      font-weight: 720;
      letter-spacing: 0;
      color: rgba(248, 251, 255, .97);
      background: linear-gradient(180deg, rgba(255, 255, 255, .98), rgba(196, 218, 255, .92) 58%, rgba(126, 168, 226, .86));
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow:
        0 18px 46px rgba(28, 98, 205, .32),
        0 3px 18px rgba(0, 0, 0, .55);
      text-wrap: balance;
      white-space: normal;
    }

    .shuffle-char {
      display: inline-block;
      min-width: .18em;
      will-change: transform, opacity, filter;
      transform: translate3d(0, 0, 0);
      transition:
        transform .34s cubic-bezier(.16, 1, .3, 1),
        opacity .24s cubic-bezier(.32, .72, 0, 1),
        filter .34s cubic-bezier(.16, 1, .3, 1);
    }

    .shuffle-char.is-shuffling {
      opacity: .56;
      filter: blur(.6px);
      transform: translate3d(0, -.08em, 0);
    }

    .shuffle-char.is-set {
      opacity: 1;
      filter: none;
      transform: translate3d(0, 0, 0);
    }

    .hero-subtitle {
      margin: 0;
      font-size: clamp(15px, 1.35vw, 22px);
      line-height: 1.45;
      font-weight: 400;
      letter-spacing: 0;
      color: rgba(235, 242, 252, .74);
      text-shadow: 0 5px 22px rgba(0, 0, 0, .44);
      opacity: 0;
      transform: translateY(8px);
      animation: subtitleRise .72s .68s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    @keyframes subtitleRise {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Bottom DDS condition box, adapted from the referenced animated dark-border input. */
    .coordinate-console,
    html[data-variant="texture"] .coordinate-console,
    html[data-variant="radar"] .coordinate-console,
    html[data-variant="silent"] .coordinate-console {
      display: grid !important;
      position: absolute;
      z-index: 7;
      left: 50%;
      bottom: clamp(24px, 4vh, 38px);
      width: min(930px, calc(100vw - 64px));
      min-height: 70px;
      transform: translateX(-50%);
      grid-template-columns: 96px minmax(250px, 1.1fr) minmax(240px, .88fr) 88px;
      gap: 8px;
      padding: 8px;
      isolation: isolate;
      overflow: visible;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-top-color: rgba(255, 255, 255, .18);
      background:
        linear-gradient(180deg, rgba(255,255,255,.042), rgba(255,255,255,.014)),
        rgba(1, 2, 4, .82);
      box-shadow:
        0 18px 58px rgba(0, 0, 0, .56),
        inset 0 1px 0 rgba(255, 255, 255, .12),
        inset 0 -1px 0 rgba(0, 0, 0, .72);
      backdrop-filter: blur(16px) saturate(1.08) brightness(1.02);
      -webkit-backdrop-filter: blur(16px) saturate(1.08) brightness(1.02);
      transition:
        transform .28s cubic-bezier(.32, .72, 0, 1),
        border-color .28s cubic-bezier(.32, .72, 0, 1),
        box-shadow .28s cubic-bezier(.32, .72, 0, 1);
    }

    .coordinate-console::before,
    .coordinate-console::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 20px;
      pointer-events: none;
      z-index: -2;
    }

    .coordinate-console::before {
      opacity: .68;
      filter: blur(12px);
      background: conic-gradient(from 75deg,
        rgba(0,0,0,0) 0deg,
        rgba(83, 113, 255, .28) 38deg,
        rgba(0,0,0,0) 92deg,
        rgba(0,0,0,0) 210deg,
        rgba(212, 184, 255, .2) 260deg,
        rgba(0,0,0,0) 322deg);
      animation: inputAuraRotate 8s linear infinite;
    }

    .coordinate-console::after {
      inset: -1px;
      z-index: -1;
      opacity: .86;
      filter: blur(.35px);
      background: conic-gradient(from 68deg,
        rgba(255,255,255,.18),
        rgba(63, 73, 112, .34) 18%,
        rgba(0,0,0,0) 38%,
        rgba(0,0,0,0) 54%,
        rgba(190, 174, 222, .2) 67%,
        rgba(0,0,0,0) 82%,
        rgba(255,255,255,.12));
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: xor;
      padding: 1px;
      animation: inputAuraRotate 10s linear infinite reverse;
    }

    .coordinate-console:focus-within {
      transform: translateX(-50%) translateY(-2px);
      border-color: rgba(230, 235, 255, .22);
      box-shadow:
        0 22px 76px rgba(0, 0, 0, .62),
        0 0 46px rgba(92, 128, 255, .12),
        inset 0 1px 0 rgba(255, 255, 255, .16),
        inset 0 -1px 0 rgba(0, 0, 0, .72);
    }

    @keyframes inputAuraRotate {
      to { transform: rotate(360deg); }
    }

    .coordinate-console select,
    .coordinate-console input,
    .coordinate-console textarea,
    .coordinate-console button {
      position: relative;
      z-index: 1;
      height: 54px;
      min-width: 0;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, .08);
      background: rgba(4, 7, 12, .76);
      color: rgba(248, 251, 255, .92);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.075), inset 0 -1px 0 rgba(0,0,0,.52);
      outline: none;
      transition:
        border-color .22s cubic-bezier(.32, .72, 0, 1),
        background-color .22s cubic-bezier(.32, .72, 0, 1),
        box-shadow .22s cubic-bezier(.32, .72, 0, 1),
        transform .22s cubic-bezier(.32, .72, 0, 1);
    }

    .coordinate-console input,
    .coordinate-console textarea {
      padding: 0 16px;
    }

    .coordinate-console select {
      padding: 0 28px 0 14px;
      appearance: none;

    .power-switch {
      --mx: 50%;
      --my: 50%;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: clamp(28px, 4.6vh, 44px);

      height: 68px;
      transform: translateX(-50%);
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;

      isolation: isolate;
      overflow: hidden;
      border: 1px solid rgba(205, 234, 255, .26);
      background:
        radial-gradient(circle at var(--mx) var(--my), rgba(255, 255, 255, .34), rgba(155, 216, 255, .12) 18%, transparent 42%),
        linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .035)),
        rgba(5, 9, 15, .58);
      box-shadow:
        0 24px 86px rgba(0, 0, 0, .7),
        0 0 42px rgba(96, 173, 255, .16),
        inset 0 1px 0 rgba(255, 255, 255, .38),
        inset 0 -24px 38px rgba(0, 0, 0, .5);
      backdrop-filter: blur(30px) saturate(1.28) brightness(1.08);
      -webkit-backdrop-filter: blur(30px) saturate(1.28) brightness(1.08);
      transition:
        transform .18s cubic-bezier(.2, .8, .2, 1),
        border-color .18s cubic-bezier(.2, .8, .2, 1),
        box-shadow .18s cubic-bezier(.2, .8, .2, 1),
        background .18s cubic-bezier(.2, .8, .2, 1);
      will-change: transform;
    }

    .power-switch::before {
      content: "";
      position: absolute;
      inset: -28px;
      z-index: -3;
      border-radius: inherit;
      background:
        conic-gradient(from 140deg, transparent 0 18%, rgba(151, 243, 255, .82), rgba(255, 246, 210, .62), rgba(97, 154, 255, .74), transparent 64% 100%);
      opacity: .72;
      filter: blur(.2px);
      animation: capsuleBorderFlow 7s linear infinite;
    }

    .power-switch::after {
      content: "";
      position: absolute;
      inset: 2px;
      z-index: -2;
      border-radius: inherit;
      background:
        radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.16), transparent 32%),
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.2), transparent 28%),
        radial-gradient(circle at 82% 86%, rgba(71, 137, 203, .24), transparent 34%),
        linear-gradient(180deg, rgba(20, 27, 38, .9), rgba(3, 7, 13, .9));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -16px 26px rgba(0,0,0,.5),
        inset 0 0 30px rgba(77, 144, 210, .08);
    }

    .capsule-flow {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(112deg, transparent 0 18%, rgba(255, 255, 255, .36), rgba(151, 243, 255, .2), transparent 52% 100%),
        radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.18), transparent 28%);
      transform: translateX(-84%);
      opacity: .72;
      animation: capsuleSheen 5.2s cubic-bezier(.5, 0, .2, 1) infinite;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .capsule-pulse {
      position: absolute;
      left: var(--mx);
      top: var(--my);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.22);
      opacity: 0;
      background: radial-gradient(circle, rgba(255,255,255,.42), rgba(151,243,255,.18) 45%, transparent 72%);
      mix-blend-mode: screen;
    }

    .power-switch.is-pressing .capsule-pulse {

    }

    .capsule-core {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: calc(100% - 13px);

    .capsule-core::before {

    .continent-breath-region::after {

          };
        });
        if (reduceMotion) return cityMarkers.slice(0, 10);
        if (!globeFxSeeds.length) buildGlobeFxSeeds();
        var breathMarkers = [];
        var maxBreath = window.innerWidth < 760 ? 60 : 460;
        var step = Math.max(1, Math.floor(globeFxSeeds.length / maxBreath));
        for (var i = 0; i < globeFxSeeds.length; i += step) {
          var p = globeFxSeeds[i];
          if (p.lat == null || p.lon == null) continue;
          var regionBreath = .5 + .5 * Math.sin(t * .00105 + p.regionPhase);
          var localPulse = .5 + .5 * Math.sin(t * (.0024 + p.energy * .0015) + p.phase);
          var visibility = Math.pow(regionBreath, 1.8) * (.45 + localPulse * .55) * (.55 + p.density * .45);
          if (visibility < .12 && hash2(i, Math.floor(t * .02)) > .18) continue;
          var warm = p.warmth > .82;
          breathMarkers.push({
            location: [p.lat, p.lon],
            size: .0042 + visibility * (.015 + p.relief * .006),
            color: warm ? [1, 0.92, 0.68] : [0.96, 1, 0.96]
          });
        }
        window.__ddsHeroDemo.cobeBreathMarkers = breathMarkers.length;
        return cityMarkers.concat(breathMarkers);
      }

      function triggerGlobeBurst(clientX, clientY) {
        var rect = earthCanvas.getBoundingClientRect();
        var x = clientX - rect.left;
        var y = clientY - rect.top;
        var cx = rect.width * .5;
        var cy = rect.height * .5;
        var r = Math.min(rect.width, rect.height) * .49;
        var dx = x - cx;
        var dy = y - cy;
        if (dx * dx + dy * dy > r * r * 1.08) return false;
        globeBursts.push({ x: x, y: y, start: performance.now(), phase: rand(0, Math.PI * 2) });
        if (globeBursts.length > 5) globeBursts.shift();
        window.__ddsHeroDemo.lastGlobeBurst = Date.now();
        return true;
      }

      function projectGlobeFxSeed(p) {
        var phi = cobeActive ? cobePhi : ((cfg.initialYaw || 0));
        var tilt = cobeActive ? 0.25 : (cfg.initialPitch || 0);
        var cy = Math.cos(phi);
        var sy = Math.sin(phi);
        var x = cy * p.x + sy * p.z;
        var z = -sy * p.x + cy * p.z;
        var y = p.y;
        var ct = Math.cos(tilt);
        var st = Math.sin(tilt);
        return {
          x: x,
          y: ct * y - st * z,
          z: st * y + ct * z
        };
      }
      function drawGlobeFx(t) {
        var rect = globeFxCanvas.getBoundingClientRect();
        var w = Math.max(1, rect.width);
        var h = Math.max(1, rect.height);
        var cx = w * .5;
        var cy = h * .5;
        var r = Math.min(w, h) * .47;
        globeFxCtx.clearRect(0, 0, w, h);

        globeFxCtx.save();
        globeFxCtx.beginPath();
        globeFxCtx.arc(cx, cy, r * 1.02, 0, Math.PI * 2);
        globeFxCtx.clip();
        globeFxCtx.globalCompositeOperation = "lighter";

        var rim = globeFxCtx.createRadialGradient(cx, cy, r * .62, cx, cy, r * 1.03);
        rim.addColorStop(0, "rgba(255,255,255,0)");
        rim.addColorStop(.68, "rgba(123,184,255,.018)");
        rim.addColorStop(.9, "rgba(128,196,255,.13)");
        rim.addColorStop(1, "rgba(220,242,255,.24)");
        globeFxCtx.fillStyle = rim;
        globeFxCtx.fillRect(0, 0, w, h);

        var glass = globeFxCtx.createRadialGradient(cx - r * .32, cy - r * .34, 0, cx - r * .32, cy - r * .34, r * .92);
        glass.addColorStop(0, "rgba(255,255,255,.085)");
        glass.addColorStop(.22, "rgba(225,239,255,.04)");
        glass.addColorStop(.62, "rgba(140,194,255,.012)");
        glass.addColorStop(1, "rgba(255,255,255,0)");
        globeFxCtx.fillStyle = glass;
        globeFxCtx.fillRect(0, 0, w, h);

        if (!reduceMotion) {
          var sweep = .5 + .5 * Math.sin(t * .00046);
          var gx = cx - r * .98 + sweep * r * 1.76;
          var lens = globeFxCtx.createLinearGradient(gx - r * .18, cy - r * .96, gx + r * .28, cy + r * .74);
          lens.addColorStop(0, "rgba(255,255,255,0)");
          lens.addColorStop(.38, "rgba(238,246,255,.018)");
          lens.addColorStop(.49, "rgba(255,252,229,.11)");
          lens.addColorStop(.6, "rgba(180,220,255,.025)");
          lens.addColorStop(1, "rgba(255,255,255,0)");
          globeFxCtx.fillStyle = lens;
          globeFxCtx.fillRect(0, 0, w, h);
        }

        if (!reduceMotion) {
          if (!globeFxSeeds.length) buildGlobeFxSeeds();
          var visibleBreath = 0;
          globeFxSeeds.forEach(function (p, index) {
            var rp = projectGlobeFxSeed(p);
            if (rp.z < -0.18) return;
            var px = cx + rp.x * r * .98;
            var py = cy + rp.y * r * .92;
            var edge = Math.sqrt(rp.x * rp.x + rp.y * rp.y);
            if (edge > 1.02) return;
            var depth = clamp((rp.z + .18) / 1.18, 0, 1);
            var regionBreath = .5 + .5 * Math.sin(t * .00105 + p.regionPhase);
            var localPulse = .5 + .5 * Math.sin(t * (.0024 + p.energy * .0015) + p.phase);
            var densityGate = hash2(index, Math.floor(t * .02) + p.region) < (.36 + regionBreath * .48 + p.density * .22);
            var edgeFade = 1 - clamp(edge - .72, 0, .3) * 1.55;
            var breatheAlpha = (.045 + p.energy * .13 + p.relief * .1) * (.36 + regionBreath * 1.08) * (.34 + localPulse * .72);
            var flicker = densityGate && hash2(index, Math.floor(t * .078)) > (.932 - p.density * .045) ? .15 + p.energy * .16 : 0;
            var alpha = (breatheAlpha + flicker) * edgeFade * (.42 + depth * .82);
            if (alpha < .012) return;
            visibleBreath += 1;
            var dot = p.size * (.82 + regionBreath * .58 + localPulse * .48 + flicker * 2.1) * (.76 + depth * .5);
            var warm = p.warmth > .82;
            globeFxCtx.fillStyle = warm ? "rgba(236,230,208," + alpha.toFixed(3) + ")" : "rgba(232,236,234," + alpha.toFixed(3) + ")";
            globeFxCtx.beginPath();
            globeFxCtx.arc(px, py, dot, 0, Math.PI * 2);
            globeFxCtx.fill();
            if ((regionBreath > .82 || flicker > 0) && index % 5 === 0) {
              globeFxCtx.fillStyle = warm ? "rgba(238,226,188," + (alpha * .34).toFixed(3) + ")" : "rgba(238,242,240," + (alpha * .3).toFixed(3) + ")";
              globeFxCtx.beginPath();
              globeFxCtx.arc(px, py, dot * (1.9 + regionBreath * 1.2), 0, Math.PI * 2);
              globeFxCtx.fill();
            }
          });
          if (continentBreathSeeds.length) {
            continentBreathSeeds.forEach(function (p, index) {
              var regionBreath = .5 + .5 * Math.sin(t * .00118 + p.regionPhase);
              var localPulse = .5 + .5 * Math.sin(t * (.0028 + p.energy * .0018) + p.phase);
              var gate = hash2(index, Math.floor(t * .025) + p.region) < (.34 + regionBreath * .48);
              if (!gate && regionBreath < .62) return;
              var px = cx + p.x * r * .98;
              var py = cy + p.y * r * .92;
              var alpha = (.055 + p.energy * .15) * p.weight * (.34 + regionBreath * 1.38) * (.4 + localPulse * .78);
              if (gate) alpha += .12 + p.energy * .1;
              alpha = clamp(alpha, 0, .58);
              var dot = p.size * (1.05 + regionBreath * .88 + localPulse * .5 + (gate ? .68 : 0));
              globeFxCtx.fillStyle = p.warm ? "rgba(238,226,194," + alpha.toFixed(3) + ")" : "rgba(235,240,238," + alpha.toFixed(3) + ")";
              globeFxCtx.beginPath();
              globeFxCtx.arc(px, py, dot, 0, Math.PI * 2);
              globeFxCtx.fill();
              if (regionBreath > .84 && index % 7 === 0) {
                globeFxCtx.fillStyle = "rgba(246,248,244," + (alpha * .22).toFixed(3) + ")";
                globeFxCtx.beginPath();
                globeFxCtx.arc(px, py, dot * 2.4, 0, Math.PI * 2);
                globeFxCtx.fill();
              }
            });
          }
          window.__ddsHeroDemo.globeFxVisibleBreath = visibleBreath;
        }

        globeFxCtx.restore();

        globeBursts = globeBursts.filter(function (burst) {
          var age = (t - burst.start) / 1000;
          return age < 1.55;
        });

        globeFxCtx.save();
        globeFxCtx.globalCompositeOperation = "lighter";
        globeBursts.forEach(function (burst) {
          var age = (t - burst.start) / 1000;
          for (var i = 0; i < 6; i += 1) {
            var p = (age - i * .095) / 1.12;
            if (p <= 0 || p >= 1) continue;
            var ease = 1 - Math.pow(1 - p, 2.2);
            var rr = r * (.045 + ease * .98);
            var alpha = Math.pow(1 - p, 1.75) * (.34 - i * .026);
            globeFxCtx.lineWidth = Math.max(.65, 2.2 - p * 1.2);
            globeFxCtx.strokeStyle = "rgba(210,232,255," + alpha.toFixed(3) + ")";
            globeFxCtx.shadowColor = "rgba(114,181,255," + (alpha * .72).toFixed(3) + ")";
            globeFxCtx.shadowBlur = 18 * (1 - p);
            globeFxCtx.beginPath();
            globeFxCtx.arc(burst.x, burst.y, rr, 0, Math.PI * 2);
            globeFxCtx.stroke();
          }
          var flash = Math.max(0, 1 - age / .38);
          if (flash > 0) {
            var glint = globeFxCtx.createRadialGradient(burst.x, burst.y, 0, burst.x, burst.y, r * .22);
            glint.addColorStop(0, "rgba(255,255,245," + (.24 * flash).toFixed(3) + ")");
            glint.addColorStop(.38, "rgba(142,198,255," + (.11 * flash).toFixed(3) + ")");
            glint.addColorStop(1, "rgba(142,198,255,0)");
            globeFxCtx.fillStyle = glint;
            globeFxCtx.beginPath();
            globeFxCtx.arc(burst.x, burst.y, r * .22, 0, Math.PI * 2);
            globeFxCtx.fill();
          }
        });
        globeFxCtx.restore();
      }

      function drawStars(t) {
        var w = size.w;
        var h = size.h;
        starCtx.clearRect(0, 0, w, h);
        var g = starCtx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, cfg.bgTop);
        g.addColorStop(.46, cfg.bgMid);
        g.addColorStop(1, cfg.bgBottom);
        starCtx.fillStyle = g;
        starCtx.fillRect(0, 0, w, h);

        if (variant === "texture") {
          var bloom = starCtx.createRadialGradient(w * .5, h * .42, 20, w * .5, h * .42, Math.min(w, h) * .54);
          bloom.addColorStop(0, "rgba(244,239,221,.12)");
          bloom.addColorStop(.48, "rgba(120,150,170,.045)");
          bloom.addColorStop(1, "rgba(0,0,0,0)");
          starCtx.fillStyle = bloom;
          starCtx.fillRect(0, 0, w, h);
        } else if (variant === "orbit") {
          var bloom = starCtx.createRadialGradient(w * .5, h * .42, 20, w * .5, h * .42, Math.min(w, h) * .52);
          bloom.addColorStop(0, "rgba(120,176,255,.14)");
          bloom.addColorStop(.52, "rgba(216,192,131,.055)");
          bloom.addColorStop(1, "rgba(0,0,0,0)");
          starCtx.fillStyle = bloom;
          starCtx.fillRect(0, 0, w, h);
        } else if (variant === "radar") {
          var aurora = starCtx.createRadialGradient(w * .52, h * .43, 30, w * .52, h * .43, Math.min(w, h) * .6);
          aurora.addColorStop(0, "rgba(142,225,189,.13)");
          aurora.addColorStop(.45, "rgba(80,170,148,.055)");
          aurora.addColorStop(1, "rgba(0,0,0,0)");
          starCtx.fillStyle = aurora;
          starCtx.fillRect(0, 0, w, h);
        }

        stars.forEach(function (s) {
          var drift = reduceMotion ? 0 : t * s.speed * (1 + s.z);
          var x = ((s.x * w) + drift * 22) % w;
          var y = (s.y * h + Math.sin(drift + s.phase) * 7) % h;
          var pulse = reduceMotion ? .7 : .5 + .5 * Math.sin(t * .001 + s.phase);
          var alpha = (.18 + s.z * .62) * (.55 + pulse * cfg.twinkle);
          starCtx.fillStyle = "rgba(255,255,255," + alpha.toFixed(3) + ")";
          starCtx.beginPath();
          starCtx.arc(x, y, s.r * (1 + s.z * .55), 0, Math.PI * 2);
          starCtx.fill();
        });
      }

      function rotatePoint(p, t) {
        var speed = reduceMotion ? cfg.speed * .08 : cfg.speed;
        var phi = (cfg.initialYaw || 0) + t * speed;
        var theta = cfg.initialPitch || 0;
        var cy = Math.cos(phi);
        var sy = Math.sin(phi);
        var cx = Math.cos(theta);
        var sx = Math.sin(theta);
        return {
          x: cy * p.x + sy * p.z,
          y: sy * sx * p.x + cx * p.y - cy * sx * p.z,
          z: -sy * cx * p.x + sx * p.y + cy * cx * p.z
        };
      }

      function drawRing(cx, cy, r, t) {
        earthCtx.save();
        earthCtx.translate(cx, cy);
        earthCtx.strokeStyle = variant === "radar" ? "rgba(142,225,189,.26)" : "rgba(255,255,255,.13)";
        earthCtx.lineWidth = 1;
        earthCtx.beginPath();
        earthCtx.ellipse(0, 0, r * 1.08, r * .34, -.18, 0, Math.PI * 2);
        earthCtx.stroke();

        if (cfg.ringMode === "sweep") {
          var a = reduceMotion ? .7 : (t * .0013) % (Math.PI * 2);
          earthCtx.strokeStyle = "rgba(142,225,189,.72)";
          earthCtx.lineWidth = 1.5;
          earthCtx.beginPath();
          earthCtx.ellipse(0, 0, r * .86, r * .86, 0, a, a + .9);
          earthCtx.stroke();

          earthCtx.strokeStyle = "rgba(216,192,131,.46)";
          earthCtx.beginPath();
          earthCtx.ellipse(0, 0, r * 1.14, r * .36, .62, a, a + .58);
          earthCtx.stroke();
        }

        earthCtx.restore();
      }


      function inverseRotatePoint(p, t) {
        var speed = reduceMotion ? cfg.speed * .08 : cfg.speed;
        var phi = (cfg.initialYaw || 0) + t * speed;
        var theta = cfg.initialPitch || 0;
        var cy = Math.cos(phi);
        var sy = Math.sin(phi);
        var cx = Math.cos(theta);
        var sx = Math.sin(theta);
        return {
          x: cy * p.x + sy * sx * p.y - sy * cx * p.z,
          y: cx * p.y + sx * p.z,
          z: sy * p.x - cy * sx * p.y + cy * cx * p.z
        };
      }

      function lonLatFromPoint(p) {
        var lat = Math.asin(clamp(p.y, -1, 1)) * 180 / Math.PI;
        var lon = Math.atan2(-p.z, p.x) * 180 / Math.PI;
        return { lon: lon, lat: lat };
      }

      function sampleWorldMap(lon, lat) {
        if (!worldMap.ready || !worldMap.data) return [20, 24, 26, 255];
        var u = ((lon + 180) / 360) % 1;
        if (u < 0) u += 1;
        var v = clamp((90 - lat) / 180, 0, 1);
        var x = Math.min(worldMap.w - 1, Math.max(0, Math.floor(u * worldMap.w)));
        var y = Math.min(worldMap.h - 1, Math.max(0, Math.floor(v * worldMap.h)));
        var idx = (y * worldMap.w + x) * 4;
        return [worldMap.data[idx], worldMap.data[idx + 1], worldMap.data[idx + 2], 255];
      }

      function drawRasterGlobe(cx, cy, r, t) {
        if (!worldMap.ready) return;
        var n = Math.floor(Math.min(window.innerWidth < 700 ? 380 : 560, Math.max(360, r * 2)));
        var speed = reduceMotion ? cfg.speed * .08 : cfg.speed;
        var ay = (cfg.initialYaw || 0) + t * speed;
        var key = n + ":" + Math.round(ay * 420) + ":" + variant;
        if (worldMap.key !== key) {
          worldMap.key = key;
          globeBuffer.canvas.width = n;
          globeBuffer.canvas.height = n;
          globeBuffer.ctx = globeBuffer.ctx || globeBuffer.canvas.getContext("2d", { willReadFrequently: true });
          var image = globeBuffer.ctx.createImageData(n, n);
          var data = image.data;
          var light = { x: -.36, y: -.28, z: .89 };
          for (var py = 0; py < n; py += 1) {
            var sy = (py / (n - 1)) * 2 - 1;
            for (var px = 0; px < n; px += 1) {
              var sx = (px / (n - 1)) * 2 - 1;
              var d = sx * sx + sy * sy;
              var out = (py * n + px) * 4;
              if (d > 1) {
                data[out + 3] = 0;
                continue;
              }
              var sz = Math.sqrt(1 - d);
              var base = inverseRotatePoint({ x: sx, y: sy, z: sz }, t);
              var ll = lonLatFromPoint(base);
              var c = sampleWorldMap(ll.lon, ll.lat);
              var ndotl = clamp(sx * light.x + sy * light.y + sz * light.z, 0, 1);
              var limb = Math.pow(clamp(sz, 0, 1), .62);
              var shade = .24 + ndotl * .72;
              shade *= .56 + limb * .44;
              data[out] = Math.floor(c[0] * shade);
              data[out + 1] = Math.floor(c[1] * shade);
              data[out + 2] = Math.floor(c[2] * shade);
              data[out + 3] = 255;
            }
          }
          globeBuffer.ctx.putImageData(image, 0, 0);
        }
        earthCtx.save();
        earthCtx.beginPath();
        earthCtx.arc(cx, cy, r, 0, Math.PI * 2);
        earthCtx.clip();
        earthCtx.drawImage(globeBuffer.canvas, cx - r, cy - r, r * 2, r * 2);
        earthCtx.restore();
      }

      function drawCoastlineRings(cx, cy, r, t) {
        if (!cfg.textureMode || !earthTexture.rings.length) return;
        var stride = window.innerWidth < 700 ? 4 : (variant === "texture" ? 1 : 2);
        earthCtx.save();
        earthCtx.beginPath();
        earthCtx.arc(cx, cy, r, 0, Math.PI * 2);
        earthCtx.clip();
        earthCtx.globalCompositeOperation = "lighter";
        earthCtx.lineWidth = variant === "texture" ? .42 : .36;
        earthCtx.strokeStyle = rgb(cfg.coast, variant === "texture" ? .24 : .18);
        earthCtx.beginPath();
        earthTexture.rings.forEach(function (ring) {
          var drawing = false;
          var lastX = 0;
          var lastY = 0;
          for (var i = 0; i < ring.length; i += 2 * stride) {
            var lon = ring[i];
            var lat = ring[i + 1];
            if (lat == null) continue;
            var basePoint = spherePointFromLatLon(lat, lon);
            var rp = rotatePoint(basePoint, t);
            var visible = rp.z > -0.18;
            var x = cx + rp.x * r;
            var y = cy + rp.y * r;
            var tooLong = drawing && Math.hypot(x - lastX, y - lastY) > r * .34;
            if (!visible || tooLong) {
              drawing = false;
              continue;
            }
            if (!drawing) {
              earthCtx.moveTo(x, y);
              drawing = true;
            } else {
              earthCtx.lineTo(x, y);
            }
            lastX = x;
            lastY = y;
          }
        });
        earthCtx.stroke();
        earthCtx.restore();
      }

      function drawEarth(t) {
        if (!earthCtx) earthCtx = earthCanvas.getContext("2d");
        if (!earthCtx) return;
        var w = earthSize.w || earthCanvas.getBoundingClientRect().width || size.w;
        var h = earthSize.h || earthCanvas.getBoundingClientRect().height || size.h;
        earthCtx.clearRect(0, 0, w, h);
        var cx = w * .5;
        var webWide = window.innerWidth >= 760;
        var cy = h * .5;
        var r = webWide ? Math.min(w, h) * .485 : Math.min(w, h) * .47;
        var breathe = variant === "silent" && !reduceMotion ? 1 + Math.sin(t * .0008) * .008 : 1;
        r *= breathe;

        var halo = earthCtx.createRadialGradient(cx, cy, r * .1, cx, cy, r * 1.48);
        halo.addColorStop(0, "rgba(255,255,255,.05)");
        halo.addColorStop(.48, cfg.halo);
        halo.addColorStop(1, "rgba(0,0,0,0)");
        earthCtx.fillStyle = halo;
        earthCtx.beginPath();
        earthCtx.arc(cx, cy, r * 1.42, 0, Math.PI * 2);
        earthCtx.fill();

        earthCtx.save();
        earthCtx.beginPath();
        earthCtx.arc(cx, cy, r, 0, Math.PI * 2);
        earthCtx.clip();
        var base = earthCtx.createRadialGradient(cx - r * .34, cy - r * .28, r * .08, cx, cy, r * 1.12);
        if (cfg.textureMode) {
          base.addColorStop(0, "rgba(255,255,255,.08)");
          base.addColorStop(.38, "rgba(54,68,76,.16)");
          base.addColorStop(.72, "rgba(8,13,20,.62)");
          base.addColorStop(1, "rgba(0,0,0,.92)");
        } else {
          base.addColorStop(0, "rgba(255,255,255,.04)");
          base.addColorStop(.62, "rgba(0,0,0,.05)");
          base.addColorStop(1, "rgba(0,0,0,.48)");
        }
        earthCtx.fillStyle = base;
        earthCtx.fillRect(cx - r, cy - r, r * 2, r * 2);
        earthCtx.restore();

        if (cfg.ringMode !== "none") drawRing(cx, cy, r, t);
        if (cfg.textureMode && worldMap.ready) drawRasterGlobe(cx, cy, r, t);
        // Keep the globe as one continuous textured volume, then add coastline and city samples.
        drawCoastlineRings(cx, cy, r, t);

        earthCtx.globalCompositeOperation = "lighter";
        particles.forEach(function (p) {
          var rp = rotatePoint(p, t);
          var visible = rp.z > -0.34;
          if (!visible) return;
          var depth = clamp((rp.z + .34) / 1.34, 0, 1);
          var limb = clamp((1 - Math.sqrt(rp.x * rp.x + rp.y * rp.y)) * 2.4, 0, 1);
          var px = cx + rp.x * r;
          var py = cy + rp.y * r;
          var tw = reduceMotion ? .55 : .5 + .5 * Math.sin(t * .004 + p.phase);
          var hot = p.hot * (.56 + tw * .8);
          var alpha;
          var color;
          var sizePoint;
          if (cfg.textureMode) {
            var coastGlow = p.coast * (.18 + depth * .36);
            var landGlow = p.land ? (.11 + depth * .34 + p.relief * .08) : (.025 + depth * .08);
            alpha = (landGlow + coastGlow) * (.56 + limb * .44) + hot * .16;
            color = p.coast > .36 ? cfg.coast : (p.land ? cfg.land : cfg.ocean);
            sizePoint = p.size * (.56 + depth * .86 + p.coast * .62 + hot * .35);
          } else {
            alpha = (.1 + depth * .52) + hot * .56;
            color = hot > .18 ? cfg.hot : cfg.particle;
            sizePoint = p.size * (.72 + depth * .9 + hot * 1.4);
          }
          earthCtx.fillStyle = rgb(color, clamp(alpha, .018, 1));
          earthCtx.beginPath();
          earthCtx.arc(px, py, sizePoint, 0, Math.PI * 2);
          earthCtx.fill();

          if (hot > .42) {
            earthCtx.fillStyle = rgb(cfg.hot, clamp(hot * (cfg.textureMode ? .16 : .26), 0, cfg.textureMode ? .38 : .6));
            earthCtx.beginPath();
            earthCtx.arc(px, py, sizePoint * (cfg.textureMode ? (1.55 + tw * .9) : (3.0 + tw * 2.1)), 0, Math.PI * 2);
            earthCtx.fill();
          }
        });
        earthCtx.globalCompositeOperation = "source-over";

        if (cfg.textureMode) {
          earthCtx.save();
          earthCtx.beginPath();
          earthCtx.arc(cx, cy, r, 0, Math.PI * 2);
          earthCtx.clip();
          var shade = earthCtx.createRadialGradient(cx - r * .28, cy - r * .3, r * .16, cx + r * .22, cy + r * .1, r * 1.12);
          shade.addColorStop(0, "rgba(255,255,255,.065)");
          shade.addColorStop(.42, "rgba(0,0,0,0)");
          shade.addColorStop(.78, "rgba(0,0,0,.28)");
          shade.addColorStop(1, "rgba(0,0,0,.76)");
          earthCtx.fillStyle = shade;
          earthCtx.fillRect(cx - r, cy - r, r * 2, r * 2);
          earthCtx.restore();
        }

        earthCtx.strokeStyle = cfg.textureMode ? "rgba(255,255,255,.2)" : (variant === "silent" ? "rgba(216,192,131,.08)" : "rgba(255,255,255,.1)");
        earthCtx.lineWidth = cfg.textureMode ? 1.4 : 1;
        earthCtx.beginPath();
        earthCtx.arc(cx, cy, r + .5, 0, Math.PI * 2);
        earthCtx.stroke();
      }

      function setupHeroTitleReveal() {
        var title = document.querySelector(".master-title");
        if (!title) return;
        title.setAttribute("aria-label", title.textContent.trim());
        window.__ddsHeroDemo.titleMotionReady = true;
      }

      function setupCityGlassPicker() {
        if (!city || city.dataset.glassReady === "1") return;
        city.dataset.glassReady = "1";
        var picker = document.createElement("div");
        picker.className = "city-glass-picker";
        picker.innerHTML = '<button class="city-glass-trigger" type="button" aria-haspopup="dialog" aria-expanded="false"></button><div class="city-glass-menu" role="dialog" aria-label="选择城市" hidden><label class="city-glass-search-wrap"><span class="sr-only">搜索城市</span><input class="city-glass-search" type="search" placeholder="搜索城市" autocomplete="off"></label><div class="city-glass-options" role="listbox" aria-label="城市列表"></div></div>';
        city.insertAdjacentElement("afterend", picker);
        var trigger = picker.querySelector(".city-glass-trigger");
        var menu = picker.querySelector(".city-glass-menu");
        var search = picker.querySelector(".city-glass-search");
        var optionsRoot = picker.querySelector(".city-glass-options");

        function renderOptions() {
          trigger.textContent = city.value || "选择城市";
          trigger.setAttribute("aria-label", "选择城市，当前" + (city.value || "未选择"));
          optionsRoot.innerHTML = "";
          var query = (search.value || "").trim().toLowerCase();
          var matches = Array.prototype.slice.call(city.options).filter(function (option) {
            return !query || option.textContent.toLowerCase().indexOf(query) !== -1;
          });
          matches.slice(0, 120).forEach(function (option) {
            var item = document.createElement("button");
            item.type = "button";
            item.className = "city-glass-option";
            item.setAttribute("role", "option");
            item.setAttribute("aria-selected", option.value === city.value ? "true" : "false");
            item.textContent = option.textContent;
            item.addEventListener("click", function () {
              city.value = option.value;
              search.value = "";
              city.dispatchEvent(new Event("change", { bubbles: true }));
              picker.classList.remove("open");
              menu.hidden = true;
              trigger.setAttribute("aria-expanded", "false");
              showToast("已切换城市：" + option.textContent);
            });
            optionsRoot.appendChild(item);
          });
          if (!matches.length || matches.length > 120) {
            var note = document.createElement("div");
            note.className = "city-glass-empty";
            note.textContent = matches.length ? "请输入关键词缩小范围" : "未找到城市";
            optionsRoot.appendChild(note);
          }
        }

        trigger.addEventListener("click", function () {
          var open = !picker.classList.contains("open");
          menu.hidden = !open;
          picker.classList.toggle("open", open);
          trigger.setAttribute("aria-expanded", open ? "true" : "false");
          if (open) {
            search.value = "";
            renderOptions();
            window.setTimeout(function () { search.focus(); }, 0);
          }
        });
        document.addEventListener("pointerdown", function (event) {
          if (!picker.contains(event.target)) {
            picker.classList.remove("open");
            menu.hidden = true;
            trigger.setAttribute("aria-expanded", "false");
          }
        });
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            picker.classList.remove("open");
            menu.hidden = true;
            trigger.setAttribute("aria-expanded", "false");
          }
        });
        search.addEventListener("input", renderOptions);
        city.addEventListener("change", renderOptions);
        renderOptions();
        window.__ddsHeroDemo.cityPicker = "custom-liquid-glass-listbox";
      }

      function setupNavInteraction() {
        var nav = document.querySelector(".liquid-nav");
        var navItems = Array.prototype.slice.call(nav.querySelectorAll(".nav-links [data-nav-mode]"));
        if (!nav || !navItems.length) return;
        var modeCopy = {
          coordinate: {
            status: "Architecture Director",
            address: "坐标 / 地址 / 地块名",
            vision: "可选提示词：产品假设、风险关注、目标客群",
            toast: "坐标分析：从地块位置开始生成 DDS 判断。"
          },
          evidence: {
            status: "Evidence Chain",
            address: "输入地块，系统会追踪证据链",
            vision: "可选：重点核查价格、竞品、交通、教育或风险来源",
            toast: "证据链模式：每个结论都会回到来源和置信边界。"
          },
          cases: {
            status: "Case Library",
            address: "输入地块，匹配案例库方向",
            vision: "可选：豪宅、低密、会所、立面、户型、总图等案例偏好",
            toast: "案例库模式：会优先召回视觉角色与对标项目。"
          },
          learning: {
            status: "Learning Loop",
            address: "输入地块，记录反馈并优化排序",
            vision: "可选：说明采纳/否决的案例、段落或风险关注",
            toast: "学习闭环模式：反馈会影响后续案例召回，不改写事实层。"
          }
        };
        function updateNavReveal(mode, copy, silent) {
          var panel = document.getElementById("navRevealPanel");
          if (!panel) return;
          var kicker = document.getElementById("navRevealKicker");
          var title = document.getElementById("navRevealTitle");
          var body = document.getElementById("navRevealCopy");
          var detail = {
            coordinate: ["坐标分析", "从坐标启动决策", "输入地址或坐标，DDS 会把地块、证据、案例和风险收束到同一个判断入口。"],
            evidence: ["证据链", "结论回到来源", "打开后优先呈现来源、置信边界和需要复核的关键证据，避免只给摘要。"],
            cases: ["案例库", "用案例校准想象", "围绕地块定位、产品假设和空间角色，召回可对标的建筑与社区经验。"],
            learning: ["学习闭环", "把反馈变成下一轮排序", "记录采纳和否决，让后续分析更贴近你的投资、设计和风控偏好。"]
          }[mode] || [copy.status, copy.status, copy.toast];
          if (kicker) kicker.textContent = detail[0];
          if (title) title.textContent = detail[1];
          if (body) body.textContent = detail[2];
          if (silent) nav.classList.remove("is-expanded");
          panel.classList.remove("is-open");
          window.__ddsHeroDemo.navReveal = "compact-mode-card";
        }
        function activate(mode, silent) {
          var copy = modeCopy[mode] || modeCopy.coordinate;
          navItems.forEach(function (item) {
            var active = item.dataset.navMode === mode;
            item.classList.toggle("is-active", active);
            if (active) item.setAttribute("aria-current", "page");
            else item.removeAttribute("aria-current");
          });
          var statusNode = nav.querySelector(".nav-status");
          if (statusNode) statusNode.textContent = copy.status;
          if (address) address.placeholder = copy.address;
          if (vision) vision.placeholder = copy.vision;
          updateNavReveal(mode, copy, silent);
          nav.classList.remove("is-live");
          void nav.offsetWidth;
          nav.classList.add("is-live");
          syncNavIndicator();
          window.__ddsHeroDemo.activeNavMode = mode;
          if (!silent) {
            triggerGlobeBurst(window.innerWidth * .5, window.innerHeight * .48);
            window.setTimeout(function () { nav.classList.remove("is-expanded"); }, 180);
          }
        }
        navItems.forEach(function (item) {
          item.addEventListener("click", function (event) {
            event.stopPropagation();
            activate(item.dataset.navMode || "coordinate", false);
          });
        });
        nav.addEventListener("click", function () {
          nav.classList.toggle("is-expanded");
          window.__ddsHeroDemo.navExpanded = nav.classList.contains("is-expanded");
        });
        document.addEventListener("pointerdown", function (event) {
          if (!nav.contains(event.target)) nav.classList.remove("is-expanded");
        });
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") nav.classList.remove("is-expanded");
        });
        activate("coordinate", true);
        if (params.get("openMenu") === "1") {
          window.setTimeout(function () { nav.classList.add("is-expanded"); }, 260);
        }
        var previewMode = params.get("openNav");
        if (previewMode && modeCopy[previewMode]) {
          window.setTimeout(function () { activate(previewMode, false); }, 220);
        }
        window.addEventListener("resize", syncNavIndicator);
        window.__ddsHeroDemo.navInteraction = "compact-card-click-expand-collapse";
      }
      function syncNavIndicator() {
        var navLinks = document.querySelector(".nav-links");
        if (!navLinks) return;
        var active = navLinks.querySelector("button[aria-current='page']") || navLinks.querySelector("button.is-active");
        if (!active) return;
        var parentRect = navLinks.getBoundingClientRect();
        var rect = active.getBoundingClientRect();
        navLinks.style.setProperty("--active-x", Math.max(4, rect.left - parentRect.left).toFixed(1) + "px");
        navLinks.style.setProperty("--active-w", rect.width.toFixed(1) + "px");
      }

      function setupGlassDockInteraction() {
        var dock = document.querySelector(".coordinate-console");
        var launcher = document.getElementById("submitBtn");
        if (!dock || !launcher) return;
        function updatePointer(event) {
          var rect = dock.getBoundingClientRect();
          var x = clamp((event.clientX - rect.left) / Math.max(1, rect.width), 0, 1);
          var y = clamp((event.clientY - rect.top) / Math.max(1, rect.height), 0, 1);
          dock.style.setProperty("--mx", (x * 100).toFixed(1) + "%");
          dock.style.setProperty("--my", (y * 100).toFixed(1) + "%");
        }
        dock.addEventListener("pointermove", updatePointer);
        dock.addEventListener("pointerleave", function () {
          dock.style.setProperty("--mx", "50%");
          dock.style.setProperty("--my", "18%");
        });
        launcher.addEventListener("pointerdown", function () {
          launcher.classList.remove("is-pressing");
          void launcher.offsetWidth;
          launcher.classList.add("is-pressing");
        });
        launcher.addEventListener("animationend", function (event) {
          if (event.animationName === "agentPressPulse") launcher.classList.remove("is-pressing");
        });
        window.__ddsHeroDemo.dockInteraction = "bottom-centered-liquid-glass-agent-input";
      }
      function frame(t) {
        t = t || 0;
        drawStars(t);
        if (cobeActive && cobeGlobe && typeof cobeGlobe.update === "function") {
          var shimmer = reduceMotion ? 5.52 : 5.46 + Math.sin(t * .00072) * .26 + Math.sin(t * .0074) * .2;
          cobeGlobe.update({ phi: cobePhi, theta: 0.25, mapBrightness: shimmer, markers: buildCobeMarkers(t) });
          window.__ddsHeroDemo.cobePhi = cobePhi;
          if (!reduceMotion) cobePhi += COBE_ROTATION_SPEED;
        } else {
          drawEarth(t);
        }
        drawGlobeFx(t);
        window.requestAnimationFrame(frame);
      }

      function onGlobePointerDown(event) {
        triggerGlobeBurst(event.clientX, event.clientY);
      }

      earthCanvas.addEventListener("pointerdown", onGlobePointerDown);

      window.addEventListener("resize", resize);
      setupHeroTitleReveal();
      setupGlassDockInteraction();
      resize();
      loadWorldMapTexture();
      loadEarthTexture();
      window.requestAnimationFrame(frame);

      var form = document.getElementById("reportForm");
      var city = document.getElementById("city");
      var address = document.getElementById("address");
      var vision = document.getElementById("vision");
      var persona = document.getElementById("persona");
      var radius = document.getElementById("radius");
      var expectedPrice = document.getElementById("expectedPrice");
      var submit = document.getElementById("submitBtn");
      var status = document.getElementById("formStatus");
      var toast = document.getElementById("toast");
      var toastTimer = null;
      var progressTimer = null;
      var REPORT_TIMEOUT_MS = 240000;
      var REPORT_STAGES = [
        "正在定位地块与检索城市数据",
        "正在计算竞品、价格带与配套条件",
        "正在组织客群、产品与风险判断",
        "正在生成完整交互报告"
      ];

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toast.classList.remove("show");
        }, 2400);
      }

      function applyCityOptions(cities) {
        var current = city.value;
        var seen = Object.create(null);
        var normalized = (cities || []).map(function (name) { return String(name || "").trim(); }).filter(function (name) {
          if (!name || seen[name]) return false;
          seen[name] = true;
          return true;
        }).sort(function (a, b) { return a.localeCompare(b, "zh-CN"); });
        if (!normalized.length) return;
        city.innerHTML = "";
        normalized.forEach(function (name) {
          var option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          city.appendChild(option);
        });
        city.value = normalized.indexOf(current) !== -1 ? current : (normalized.indexOf("济南") !== -1 ? "济南" : normalized[0]);
        city.dispatchEvent(new Event("change", { bubbles: true }));
      }

      function loadCityOptions() {
        fetch("/api/cities", { headers: { "Accept": "application/json" } })
          .then(function (response) {
            if (!response.ok) throw new Error("城市列表加载失败");
            return response.json();
          })
          .then(function (data) {
            if (data.status !== "ok" || !Array.isArray(data.cities)) throw new Error("城市列表不可用");
            applyCityOptions(data.cities);
            window.__ddsHeroDemo.citySource = "api-cities";
          })
          .catch(function () {
            window.__ddsHeroDemo.citySource = "inline-fallback";
            showToast("城市列表暂时未更新，已使用常用城市");
          });
      }

      function stopProgress() {
        if (progressTimer) window.clearInterval(progressTimer);
        progressTimer = null;
      }

      function startProgress() {
        stopProgress();
        var stage = 0;
        setMode("running", REPORT_STAGES[stage]);
        progressTimer = window.setInterval(function () {
          stage = Math.min(stage + 1, REPORT_STAGES.length - 1);
          status.textContent = REPORT_STAGES[stage];
        }, 9000);
      }

      function setMode(mode, text) {
        var busy = mode === "running";
        form.classList.remove("running", "done", "error");
        if (mode) form.classList.add(mode);
        form.setAttribute("aria-busy", busy ? "true" : "false");
        status.textContent = text || "";
        [city, address, vision].forEach(function (field) { field.disabled = busy; });
        var cityTrigger = form.querySelector(".city-glass-trigger");
        if (cityTrigger) cityTrigger.disabled = busy;
        submit.disabled = busy;
        submit.querySelector("span").textContent = busy ? "生成中" : (mode === "done" ? "正在打开" : "开始分析");
      }

      function buildPayload() {
        var price = expectedPrice.value.trim();
        return {
          city: city.value,
          address: address.value.trim(),
          radius_km: Number(radius.value || 5),
          expected_price: price ? Number(price) : null,
          vision: vision.value.trim() || null,
          persona: persona.value || "developer",
          analysis_mode: window.__ddsHeroDemo.activeNavMode || "coordinate",
          entry_source: "earth-hero",
          price_band: .15,
          year: 2026
        };
      }

      function fillDemo() {
        city.value = "济南";
        address.value = "36.6653,117.0249";
        vision.value = "低密改善，关注竞品、客群与风险边界";
        city.dispatchEvent(new Event("change", { bubbles: true }));
      }

      document.getElementById("loadDemoBtn").addEventListener("click", fillDemo);
      setupCityGlassPicker();
      setupNavInteraction();
      loadCityOptions();
      window.__ddsHeroDemo.reportFlow = "api-report-direct-navigation";

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var payload = buildPayload();
        if (!payload.address) {
          address.placeholder = "请输入地址或坐标";
          setMode("error", "请先输入地址、地块名或经纬度坐标");
          showToast("缺少地块位置，暂时无法生成报告");
          address.focus({ preventScroll: true });
          window.setTimeout(function () { form.classList.remove("error"); }, 360);
          return;
        }

        startProgress();
        try {
          sessionStorage.setItem("ddsHeroDemo:lastPayload", JSON.stringify(payload));
        } catch (e) {}

        var controller = window.AbortController ? new AbortController() : null;
        var timer = controller ? window.setTimeout(function () { controller.abort(); }, REPORT_TIMEOUT_MS) : null;

        fetch("/api/report", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload),
          signal: controller ? controller.signal : undefined
        })
          .then(function (response) {
            return response.json().then(function (data) {
              if (!response.ok || data.status === "error") {
                throw new Error(data.message || "报告生成失败，请稍后重试");
              }
              return data;
            });
          })
          .then(function (data) {
            var report = data.report_json || {};
            var reportUrl = data.report_url || (report.export && report.export.interactive_html_url);
            if (typeof reportUrl !== "string" || reportUrl.indexOf("/reports/interactive/") !== 0) {
              throw new Error("报告已生成，但返回地址无效");
            }
            try {
              sessionStorage.setItem("ddsHeroDemo:lastReport", JSON.stringify(report));
            } catch (e) {}
            stopProgress();
            setMode("done", "报告已生成，正在打开");
            showToast(data.warning || "完整研判报告已生成");
            window.__ddsHeroDemo.lastReportUrl = reportUrl;
            window.setTimeout(function () {
              window.location.assign(reportUrl);
            }, 260);
          })
          .catch(function (err) {
            stopProgress();
            var message = err && err.name === "AbortError"
              ? "报告生成超过 240 秒，请检查输入后重试"
              : (err.message || "报告生成失败，请稍后重试");
            setMode("error", message);
            showToast(message);
            address.focus({ preventScroll: true });
          })
          .finally(function () {
            if (timer) window.clearTimeout(timer);
          });
      });
    })();
  </script>

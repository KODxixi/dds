# DDS 旧版调试栈 — Flask API + Nginx 反向代理
# 运行：注入已验收 image digests 后执行 docker compose -f docker-compose.full.yml up -d --pull never
# 停止：docker compose -f docker-compose.full.yml down
#
# 仅供本机调试。生产环境必须使用 docker-compose.yml，由现有
# GarchOS/Caddy 代理到 127.0.0.1:8080；本文件不得占用公网 80/443。
#
# Flask 不直接暴露端口，仅通过 Nginx 反向代理对外提供服务。

x-dds-image: &dds-image "${DDS_IMAGE_REPOSITORY:?set the DDS image repository}@${DDS_IMAGE_DIGEST:?set the immutable sha256 digest}"
x-nginx-image: &nginx-image "${DDS_NGINX_IMAGE_REPOSITORY:?set the Nginx image repository}@${DDS_NGINX_IMAGE_DIGEST:?set the immutable sha256 digest}"

services:
  dds-app:
    image: *dds-image
    container_name: dds-app
    restart: unless-stopped
    env_file:
      - ./.env.dds-cloud
    expose:
      - "8080"
    volumes:
      - dds-cache:/app/cache
      - dds-vault:/app/Vault
      - dds-data-out:/app/data_out
    networks:
      - dds-private
    healthcheck:
      test: ["CMD", "python", "-B", "/app/cloud/volcengine/service/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  dds-web:
    image: *nginx-image
    container_name: dds-web
    restart: unless-stopped
    depends_on:
      dds-app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      # Nginx 配置（全栈内部网络版）
      - ./nginx.full.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dds-private
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/api/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  dds-private:
    driver: bridge

volumes:
  dds-cache:
  dds-vault:
  dds-data-out:

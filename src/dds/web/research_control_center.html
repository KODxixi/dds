<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DDS Research Control Center</title>
  <style>
    :root {
      --liquid-glass-bg: rgba(18,18,18,.30); --liquid-glass-bg-strong: rgba(18,18,18,.42);
      --liquid-glass-blur: 28px; --text: rgba(255,255,255,.94); --muted: rgba(255,255,255,.66);
      --line: rgba(255,255,255,.11); --plate: rgba(8,8,10,.62); --brand: #2e8dff;
      --success: #34c759; --danger: #ff453a; --radius: 28px; --control: 19.2px;
      --ease: cubic-bezier(.16,1,.3,1);
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--text); font-family:"SF Pro SC","PingFang SC","Microsoft YaHei UI",sans-serif; letter-spacing:0; background:#09090b; }
    .scene { position:fixed; inset:0; z-index:-2; background:
      radial-gradient(circle at 18% 20%, rgba(58,94,135,.48), transparent 34%),
      radial-gradient(circle at 82% 12%, rgba(98,83,68,.28), transparent 30%),
      linear-gradient(135deg,#111722 0%,#131315 48%,#08090b 100%); }
    .mask { position:fixed; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(5,6,8,.18),rgba(5,6,8,.58)); }
    header { position:sticky; top:16px; z-index:5; max-width:1280px; margin:16px auto 0; padding:13px 18px; display:flex; align-items:center; justify-content:space-between; border-radius:999px; background:rgba(18,18,18,.24); backdrop-filter:blur(22px) saturate(108%); box-shadow:0 1px 2px rgba(0,0,0,.4),0 18px 42px rgba(0,0,0,.22); }
    .brand { font-weight:750; } .brand span { color:var(--muted); font-weight:450; margin-left:9px; }
    .source-state { font-size:13px; color:var(--muted); }
    main { max-width:1280px; margin:56px auto; padding:0 22px 64px; }
    .hero { display:grid; grid-template-columns:1.18fr .82fr; gap:22px; align-items:stretch; }
    .glass { background:var(--liquid-glass-bg); backdrop-filter:blur(var(--liquid-glass-blur)) saturate(108%) contrast(1.03); border-radius:var(--radius); box-shadow:inset 1px 1px rgba(255,255,255,.10),0 2px 3px rgba(0,0,0,.35),0 30px 70px rgba(0,0,0,.28); }
    .intro { padding:42px; } .intro h1 { font-size:clamp(34px,5vw,66px); line-height:1.06; margin:0; max-width:760px; } .intro p { color:var(--muted); line-height:1.75; font-size:17px; max-width:720px; }
    .status-card { padding:28px; display:flex; flex-direction:column; gap:14px; }
    .plate { background:var(--plate); border-radius:16px; padding:16px 18px; }
    .plate strong { display:block; font-size:28px; font-variant-numeric:tabular-nums; } .plate small { color:var(--muted); }
    .workspace { margin-top:22px; padding:30px; }
    .workspace h2 { margin:0 0 20px; font-size:24px; }
    form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    label { display:grid; gap:7px; color:var(--muted); font-size:13px; }
    label.wide { grid-column:1/-1; }
    input,textarea { width:100%; border:0; outline:0; color:var(--text); background:rgba(0,0,0,.34); border-radius:var(--control); padding:14px 16px; font:inherit; box-shadow:inset 0 1px rgba(255,255,255,.06); }
    input:focus,textarea:focus { box-shadow:0 0 0 2px var(--brand),inset 0 1px rgba(255,255,255,.06); }
    textarea { min-height:92px; resize:vertical; }
    .actions { grid-column:1/-1; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    button,.file-button { cursor:pointer; border:0; color:var(--text); padding:12px 19px; border-radius:999px; background:rgba(255,255,255,.09); box-shadow:inset 1px 1px rgba(255,255,255,.13),0 8px 20px rgba(0,0,0,.22); transition:transform .22s var(--ease),background-color .22s var(--ease); font:inherit; }
    button:hover,.file-button:hover { transform:translateY(-1px); background:rgba(255,255,255,.14); } button.primary { background:rgba(46,141,255,.24); }
    #file { display:none; } #message { color:var(--muted); font-size:13px; }
    .results { display:grid; grid-template-columns:.78fr 1.22fr; gap:22px; margin-top:22px; }
    .panel { padding:26px; min-height:280px; } .panel h3 { margin:0 0 15px; }
    .log,.candidate { margin-bottom:10px; } .log time { color:var(--muted); font-size:12px; display:block; }
    .candidate a { color:var(--text); text-decoration:none; font-weight:650; } .candidate p { color:var(--muted); margin:7px 0 0; line-height:1.55; }
    .empty { color:var(--muted); padding:34px 0; text-align:center; }
    @media(max-width:820px){ .hero,.results{grid-template-columns:1fr} form{grid-template-columns:1fr} .intro{padding:30px} header{margin:10px 12px 0} }
    @media(prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important} }
  </style>
</head>
<body>
  <div class="scene"></div><div class="mask"></div>
  <header><div class="brand">DDS <span>Research Control Center</span></div><div class="source-state" id="sourceState">正在检查数据源…</div></header>
  <main>
    <section class="hero">
      <div class="glass intro"><h1>让 Agent 主动研究，<br>不是等待资料。</h1><p>输入项目范围后，系统自动拆解数据需求，调用外部数据库与搜索 API，冻结每条候选来源，并把缺口和运行日志直接呈现给你。</p></div>
      <div class="glass status-card"><div class="plate"><small>研究任务</small><strong id="jobCount">0</strong></div><div class="plate"><small>候选证据</small><strong id="candidateCount">0</strong></div><div class="plate"><small>当前状态</small><strong id="runState">待创建</strong></div></div>
    </section>
    <section class="glass workspace">
      <h2>创建主动研究任务</h2>
      <form id="jobForm">
        <label>项目名称<input name="project_name" required placeholder="例如：江岸滨水项目"></label>
        <label>城市<input name="city" required placeholder="例如：武汉"></label>
        <label>区域<input name="district" placeholder="例如：江岸区"></label>
        <label>项目类型<input name="project_type" placeholder="例如：住宅"></label>
        <label class="wide">需要回答的决策问题<textarea name="decision_question" placeholder="例如：目标客群、产品组合和价格边界是什么？"></textarea></label>
        <div class="actions"><button class="primary" type="submit">创建并主动研究</button><label class="file-button" for="file">上传项目资料</label><input id="file" type="file"><span id="message">资料会在任务创建后上传并计算哈希。</span></div>
      </form>
    </section>
    <section class="results">
      <div class="glass panel"><h3>运行日志</h3><div id="logs" class="empty">尚无任务日志</div></div>
      <div class="glass panel"><h3>候选证据来源</h3><div id="candidates" class="empty">Agent 完成检索后显示来源</div></div>
    </section>
  </main>
  <script>
    let currentJob = null;
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    async function refreshSources(){ const data=await fetch('/api/research-sources').then(r=>r.json()); const ready=data.filter(x=>x.available).length; $('sourceState').textContent=`数据源 ${ready}/${data.length} 可用`; }
    async function refreshJobs(){ const jobs=await fetch('/api/research-jobs').then(r=>r.json()); $('jobCount').textContent=jobs.length; }
    async function showJob(){ if(!currentJob)return; const job=await fetch(`/api/research-jobs/${currentJob}`).then(r=>r.json()); $('candidateCount').textContent=job.candidates.length; $('runState').textContent=job.status; $('logs').className=''; $('logs').innerHTML=job.logs.map(x=>`<div class="plate log"><time>${escapeHtml(x.timestamp)}</time>${escapeHtml(x.message)}</div>`).join(''); $('candidates').className=''; $('candidates').innerHTML=job.candidates.length?job.candidates.map(x=>`<article class="plate candidate"><a href="${escapeHtml(x.source_ref)}" target="_blank" rel="noreferrer">${escapeHtml(x.title)}</a><p>${escapeHtml(x.snippet)}</p></article>`).join(''):'<div class="empty">没有合格的候选来源；请检查数据源配置。</div>'; }
    $('jobForm').addEventListener('submit',async event=>{ event.preventDefault(); $('message').textContent='正在创建任务…'; const payload=Object.fromEntries(new FormData(event.target)); const response=await fetch('/api/research-jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}); const job=await response.json(); currentJob=job.job_id; const file=$('file').files[0]; if(file){ await fetch(`/api/research-jobs/${currentJob}/materials?filename=${encodeURIComponent(file.name)}`,{method:'POST',headers:{'content-type':file.type||'application/octet-stream'},body:file}); } $('message').textContent='Agent 正在调用外部数据源…'; await fetch(`/api/research-jobs/${currentJob}/run`,{method:'POST'}); $('message').textContent='研究完成；候选资料仍需证据资格判定。'; await Promise.all([showJob(),refreshJobs(),refreshSources()]); });
    Promise.all([refreshSources(),refreshJobs()]).catch(()=>{$('sourceState').textContent='API 连接失败'});
  </script>
</body>
</html>

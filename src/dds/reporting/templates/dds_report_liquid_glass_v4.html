<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>__DOCUMENT_TITLE__</title>
  <style>
    :root {
      --report-width: 1480px;
      --primary-width: 840px;
      --decision-width: 460px;
      --nav-height: 58px;
      --glass-fill: rgba(16,16,17,.28);
      --glass-fill-strong: rgba(12,12,13,.34);
      --glass-edge: rgba(255,255,255,.10);
      --glass-edge-dim: rgba(255,255,255,.025);
      --plate: rgba(8,8,9,.72);
      --ink: rgba(255,255,255,.94);
      --text: rgba(255,255,255,.72);
      --muted: rgba(255,255,255,.50);
      --faint: rgba(255,255,255,.32);
      --data: #77d7ee;
      --opportunity: #75c997;
      --warning: #e6b96c;
      --risk: #d98268;
      --secondary: #aaa1ca;
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 15px;
      --ease: cubic-bezier(.32,.72,0,1);
      --contact-shadow: 0 2px 4px rgba(0,0,0,.38);
      --environment-shadow: 0 28px 70px rgba(0,0,0,.32);
    }

    * { box-sizing: border-box; }
    html {
      min-height: 100%;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    html::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background: #09090a;
      font-family: "SF Pro SC","PingFang SC","Microsoft YaHei UI","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
      font-feature-settings: "tnum" 1,"ss01" 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    .scene-background,
    .scene-mask {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .scene-background {
      z-index: -2;
      background:
        var(--scene-image, none) center / cover no-repeat,
        radial-gradient(circle at 18% 8%, #3d4143 0, #202224 32%, #101112 68%, #080809 100%);
      transform: scale(1.015);
    }
    .scene-mask {
      z-index: -1;
      background: linear-gradient(180deg,rgba(7,7,8,.55),rgba(7,7,8,.76));
    }

    .glass {
      position: relative;
      background: var(--glass-fill);
      -webkit-backdrop-filter: blur(30px) saturate(1.12) brightness(.82) contrast(1.04);
      backdrop-filter: blur(30px) saturate(1.12) brightness(.82) contrast(1.04);
      box-shadow:
        inset 1px 1px 0 var(--glass-edge),
        inset -1px -1px 0 var(--glass-edge-dim),
        var(--contact-shadow),
        var(--environment-shadow);
    }
    .glass::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(135deg,rgba(255,255,255,.045),transparent 24%,transparent 76%,rgba(0,0,0,.08));
      mix-blend-mode: screen;
      opacity: .65;
    }
    .solid-plate {
      background: var(--plate);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.28);
    }

    .top-nav {
      position: fixed;
      z-index: 50;
      top: 18px;
      left: 50%;
      width: min(calc(100vw - 32px), var(--report-width));
      min-height: var(--nav-height);
      transform: translateX(-50%);
      border-radius: 24px;
      display: grid;
      grid-template-columns: minmax(180px,1fr) auto minmax(180px,1fr);
      align-items: center;
      gap: 20px;
      padding: 8px 12px 8px 18px;
      background: rgba(18,18,19,.20);
      -webkit-backdrop-filter: blur(22px) saturate(1.08) brightness(.88);
      backdrop-filter: blur(22px) saturate(1.08) brightness(.88);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.12),
        inset -1px -1px 0 rgba(255,255,255,.02),
        0 2px 4px rgba(0,0,0,.30),
        0 18px 50px rgba(0,0,0,.24);
    }
    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-dot {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,255,255,.30));
      box-shadow: inset 1px 1px 0 #fff,0 1px 4px rgba(0,0,0,.4);
    }
    .section-nav,
    .mode-switch {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: 18px;
      background: rgba(0,0,0,.18);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.25);
    }
    .section-nav { justify-self: center; }
    .mode-switch { justify-self: end; }
    .nav-button,
    .mode-button,
    .source-button,
    .drawer-close {
      position: relative;
      z-index: 1;
      border: 0;
      border-radius: 15px;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      transition: transform 250ms var(--ease),background-color 250ms var(--ease),color 250ms var(--ease),box-shadow 250ms var(--ease);
    }
    .nav-button { padding: 9px 13px; font-size: 12px; font-weight: 650; }
    .mode-button,.source-button { padding: 9px 13px; font-size: 12px; font-weight: 700; }
    .nav-button:hover,
    .mode-button:hover,
    .source-button:hover { color: var(--ink); transform: translateY(-1px); }
    .nav-button.is-active,
    .mode-button.is-active {
      color: var(--ink);
      background: rgba(255,255,255,.10);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.24);
    }

    .reading-root {
      width: min(calc(100vw - 32px), var(--report-width));
      margin: 0 auto;
      padding: 104px 0 100px;
    }
    .report-slot {
      min-height: max(760px,calc(100vh - 84px));
      padding: 42px 0 70px;
      scroll-margin-top: 94px;
      display: grid;
      align-items: center;
    }
    .slot-placeholder {
      min-height: 680px;
      display: grid;
      place-items: center;
      color: var(--faint);
      font-size: 12px;
    }

    .report-page {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0,var(--primary-width)) minmax(440px,var(--decision-width));
      grid-template-areas:
        "primary decision"
        "conclusion conclusion"
        "foot foot";
      justify-content: space-between;
      gap: 26px clamp(52px,6vw,100px);
    }
    .primary-column { grid-area: primary; min-width: 0; display: grid; align-content: start; gap: 20px; }
    .page-header { display: grid; gap: 11px; padding: 0 4px; }
    .display-code {
      margin: 0;
      color: var(--data);
      font-size: 12px;
      font-weight: 780;
    }
    .display-title {
      margin: 0;
      max-width: 18em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(32px,3vw,52px);
      line-height: 1.12;
      letter-spacing: -.045em;
      font-weight: 790;
    }
    .section-label {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .primary-visual {
      min-width: 0;
      min-height: 470px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: grid;
      align-content: stretch;
    }
    .visual-surface {
      min-height: 470px;
      border-radius: var(--radius-xl);
      padding: 24px;
      display: grid;
      align-content: center;
      gap: 18px;
    }
    .media-figure {
      margin: 0;
      min-height: 470px;
      display: grid;
      grid-template-rows: minmax(0,1fr) auto;
      gap: 12px;
    }
    .media-frame {
      min-height: 420px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: rgba(5,5,6,.50);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.06),var(--contact-shadow),var(--environment-shadow);
    }
    .media-frame img { width: 100%; height: 100%; min-height: 420px; max-height: 600px; display: block; object-fit: cover; }
    .media-frame.is-contain img { object-fit: contain; }
    .media-caption {
      border-radius: var(--radius-md);
      padding: 12px 15px;
      color: var(--text);
      font-size: 12px;
      line-height: 1.55;
    }
    .narrative {
      margin: 0;
      color: var(--text);
      font-size: clamp(18px,1.5vw,24px);
      line-height: 1.72;
    }
    .metric-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .metric {
      min-width: 0;
      border-radius: var(--radius-md);
      padding: 17px;
      display: grid;
      gap: 7px;
    }
    .metric span { color: var(--muted); font-size: 11px; }
    .metric strong { color: var(--ink); font-size: clamp(24px,2.2vw,38px); line-height: 1.05; overflow-wrap: anywhere; }
    .metric small { color: var(--faint); font-size: 10px; line-height: 1.45; }
    .item-list { display: grid; gap: 9px; }
    .item-row { border-radius: 13px; padding: 12px 14px; color: var(--text); font-size: 12px; line-height: 1.55; }

    .chart-shell { min-height: 470px; display: grid; grid-template-rows: auto 1fr auto; gap: 16px; }
    .chart-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; }
    .chart-head h2 { margin: 0; font-size: 20px; line-height: 1.35; }
    .chart-head span { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
    .decision-chart { width: 100%; height: 100%; min-height: 330px; overflow: visible; }
    .chart-axis { stroke: rgba(255,255,255,.14); stroke-width: 1; }
    .chart-grid { stroke: rgba(255,255,255,.07); stroke-width: 1; stroke-dasharray: 3 6; }
    .chart-label { fill: rgba(255,255,255,.66); font-size: 12px; }
    .chart-value { fill: rgba(255,255,255,.92); font-size: 12px; font-weight: 700; }
    .chart-bar-data { fill: var(--data); }
    .chart-bar-positive { fill: var(--opportunity); }
    .chart-bar-negative { fill: var(--risk); }
    .chart-note { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .diagram-canvas {
      min-height: 470px;
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      gap: 18px;
      padding: 20px 0 10px;
    }
    .diagram-track {
      min-width: 0;
      display: flex;
      align-items: stretch;
      gap: 10px;
    }
    .diagram-card {
      min-width: 0;
      flex: 1 1 0;
      border-radius: var(--radius-lg);
      padding: 20px 18px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      align-content: start;
      gap: 10px;
      background: rgba(16,16,17,.24);
    }
    .diagram-card > * { position: relative; z-index: 1; }
    .diagram-code {
      color: var(--data);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .02em;
    }
    .diagram-card strong {
      color: var(--ink);
      font-size: clamp(17px,1.35vw,22px);
      line-height: 1.32;
    }
    .diagram-details {
      display: grid;
      align-content: start;
      gap: 9px;
      padding-top: 8px;
    }
    .diagram-details span {
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
    }
    .diagram-details .is-risk { color: var(--risk); }
    .diagram-connector {
      flex: 0 0 20px;
      align-self: center;
      height: 2px;
      background: var(--data);
      position: relative;
      opacity: .88;
    }
    .diagram-connector::after {
      content: "";
      position: absolute;
      right: 0;
      top: 50%;
      width: 8px;
      height: 8px;
      border-top: 2px solid var(--data);
      border-right: 2px solid var(--data);
      transform: translateY(-50%) rotate(45deg);
    }

    .data-table { width: 100%; border-collapse: separate; border-spacing: 0 7px; table-layout: fixed; }
    .data-table th { padding: 5px 10px; color: var(--muted); font-size: 10px; text-align: left; font-weight: 650; }
    .data-table td { padding: 11px 10px; background: var(--plate); color: var(--text); font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; }
    .data-table td:first-child { border-radius: 12px 0 0 12px; }
    .data-table td:last-child { border-radius: 0 12px 12px 0; }

    .decision-card {
      grid-area: decision;
      align-self: center;
      min-width: 0;
      border-radius: var(--radius-xl);
      padding: 28px;
      display: grid;
      align-content: start;
      gap: 22px;
      background: var(--glass-fill-strong);
    }
    .decision-card > * { position: relative; z-index: 1; }
    .decision-kicker { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .decision-kicker::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--data); box-shadow:0 0 0 4px rgba(119,215,238,.08); }
    .decision-question { margin: 0; font-size: clamp(21px,1.8vw,29px); line-height: 1.38; font-weight: 760; }
    .decision-takeaway { margin: 0; color: var(--text); font-size: 15px; line-height: 1.75; }
    .decision-facts { display: grid; gap: 8px; }
    .decision-fact { border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; }
    .decision-fact span { color: var(--muted); font-size: 10px; }
    .decision-fact strong { color: var(--ink); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .decision-impact { border-top: 1px solid rgba(255,255,255,.07); padding-top: 18px; }
    .decision-impact span { display: block; margin-bottom: 7px; color: var(--warning); font-size: 10px; font-weight: 720; }
    .decision-impact p { margin: 0; color: var(--text); font-size: 13px; line-height: 1.68; }

    .conclusion-board {
      grid-area: conclusion;
      border-radius: 20px;
      padding: 17px 21px;
      display: grid;
      grid-template-columns: auto minmax(0,1fr);
      align-items: center;
      gap: 16px;
    }
    .conclusion-board span { color: var(--muted); font-size: 10px; font-weight: 720; }
    .conclusion-board strong { color: var(--ink); font-size: 15px; line-height: 1.55; }
    .page-foot {
      grid-area: foot;
      padding: 0 4px;
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto auto;
      align-items: center;
      gap: 13px;
      color: var(--faint);
      font-size: 9px;
    }
    .status-chip { color: var(--data); }
    .status-chip[data-status="partial"],
    .status-chip[data-status="not_assessable"] { color: var(--warning); }
    .status-chip[data-status="blocked"],
    .status-chip[data-status="missing"] { color: var(--risk); }
    .source-summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .presentation-root {
      display: none;
      position: fixed;
      z-index: 20;
      inset: 92px 16px 16px;
      place-items: center;
    }
    body[data-mode="presentation"] { overflow: hidden; }
    body[data-mode="presentation"] .reading-root { display: none; }
    body[data-mode="presentation"] .presentation-root { display: grid; }
    .presentation-frame {
      width: min(calc(100vw - 32px),calc((100vh - 108px) * 16 / 9));
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 26px;
    }
    .presentation-frame .report-page {
      width: 100%;
      height: 100%;
      padding: 26px 30px 18px;
      grid-template-columns: minmax(0,1fr) minmax(320px,360px);
      grid-template-rows: minmax(0,1fr) auto auto;
      gap: 14px 24px;
      align-content: stretch;
    }
    .presentation-frame .primary-column {
      min-height: 0;
      grid-template-rows: auto minmax(0,1fr);
      align-content: stretch;
      gap: 11px;
    }
    .presentation-frame .page-header { gap: 5px; }
    .presentation-frame .display-title { font-size: clamp(24px,2.4vw,38px); }
    .presentation-frame .section-label { display: none; }
    .presentation-frame .primary-visual,
    .presentation-frame .visual-surface,
    .presentation-frame .media-figure { min-height: 0; height: 100%; }
    .presentation-frame .primary-visual { align-self: stretch; }
    .presentation-frame .media-frame { min-height: 0; }
    .presentation-frame .media-frame img { min-height: 0; height: 100%; max-height: none; }
    .presentation-frame .media-caption { padding: 8px 11px; font-size: 9px; }
    .presentation-frame .visual-surface { padding: 16px; }
    .presentation-frame .chart-shell { min-height: 0; gap: 8px; }
    .presentation-frame .decision-chart { min-height: 190px; }
    .presentation-frame .diagram-canvas { min-height: 0; height: 100%; gap: 8px; padding: 4px 0; overflow: hidden; }
    .presentation-frame .diagram-track { min-height: 0; }
    .presentation-frame .diagram-card {
      min-height: 0;
      grid-template-rows: auto auto auto;
      align-content: center;
    }
    .presentation-frame .diagram-track:not(.is-dense) { gap: 6px; }
    .presentation-frame .diagram-track:not(.is-dense) .diagram-card {
      padding: 14px 10px;
      gap: 5px;
    }
    .presentation-frame .diagram-track:not(.is-dense) .diagram-card strong {
      font-size: clamp(15px,1.05vw,20px);
      line-height: 1.25;
      text-wrap: balance;
    }
    .presentation-frame .diagram-track:not(.is-dense) .diagram-details span {
      font-size: clamp(10px,.7vw,12px);
      line-height: 1.4;
    }
    .presentation-frame .diagram-track:not(.is-dense) .diagram-connector { flex-basis: 12px; }
    .presentation-frame .diagram-track.is-dense {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      grid-template-rows: repeat(2,minmax(0,1fr));
      gap: 8px;
    }
    .presentation-frame .diagram-track.is-dense .diagram-connector { display: none; }
    .presentation-frame .diagram-track.is-dense .diagram-card {
      min-height: 0;
      padding: 10px 11px;
      gap: 4px;
    }
    .presentation-frame .diagram-track.is-dense .diagram-card strong { font-size: 15px; }
    .presentation-frame .diagram-track.is-dense .diagram-details { gap: 4px; padding-top: 3px; }
    .presentation-frame .diagram-track.is-dense .diagram-details span { font-size: 10px; line-height: 1.35; }
    .presentation-frame .decision-card { align-self: stretch; min-height: 0; padding: 20px; gap: 12px; overflow: hidden; }
    .presentation-frame .decision-question { font-size: 20px; }
    .presentation-frame .decision-takeaway { font-size: 12px; line-height: 1.55; }
    .presentation-frame .decision-facts { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px; }
    .presentation-frame .decision-fact { min-width: 0; padding: 7px 9px; gap: 2px; }
    .presentation-frame .decision-fact strong { font-size: 11px; line-height: 1.35; }
    .presentation-frame .decision-impact { padding-top: 10px; }
    .presentation-frame .decision-impact p { font-size: 11px; line-height: 1.48; }
    .presentation-frame .conclusion-board { padding: 10px 14px; }
    .presentation-frame .conclusion-board strong { font-size: 12px; }
    .presentation-frame .page-foot { font-size: 8px; }

    .source-drawer {
      position: fixed;
      z-index: 80;
      top: 18px;
      right: 16px;
      bottom: 18px;
      width: min(460px,calc(100vw - 32px));
      border-radius: 28px;
      padding: 22px;
      transform: translateX(calc(100% + 32px));
      opacity: 0;
      pointer-events: none;
      transition: transform 350ms var(--ease),opacity 250ms var(--ease);
    }
    .source-drawer.is-open { transform: translateX(0); opacity: 1; pointer-events: auto; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 18px; }
    .drawer-head h2 { margin: 0; font-size: 18px; }
    .drawer-close { width: 34px; height: 34px; background: rgba(255,255,255,.08); }
    .source-list { height: calc(100% - 54px); overflow-y: auto; scrollbar-width: none; display: grid; align-content: start; gap: 9px; }
    .source-list::-webkit-scrollbar { display:none; }
    .source-entry { border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
    .source-entry strong { font-size: 12px; overflow-wrap: anywhere; }
    .source-entry span { color: var(--muted); font-size: 10px; line-height: 1.5; overflow-wrap: anywhere; }

    .runtime-fallback {
      width: min(calc(100vw - 32px),920px);
      margin: 140px auto 0;
      border-radius: 28px;
      padding: 34px;
    }
    .runtime-fallback h1 { margin: 0 0 12px; font-size: 28px; }
    .runtime-fallback p { margin: 0; color: var(--text); line-height: 1.7; }
    .print-root { display: none; }

    @media (max-width: 1320px) {
      :root { --primary-width: 760px; --decision-width: 420px; }
      .report-page { grid-template-columns: minmax(0,var(--primary-width)) minmax(400px,var(--decision-width)); gap-column: 48px; }
      .section-nav .nav-button { padding-inline: 9px; }
    }
    @media (max-width: 1120px) {
      .top-nav { grid-template-columns: minmax(0,1fr) auto; }
      .section-nav { display:none; }
      .report-page {
        grid-template-columns: 1fr;
        grid-template-areas: "primary" "decision" "conclusion" "foot";
      }
      .decision-card { align-self: auto; }
      .primary-visual,.visual-surface,.media-figure { min-height: 380px; }
      .media-frame,.media-frame img { min-height: 350px; }
      .diagram-canvas { min-height: 390px; }
    }
    @media (max-width: 720px) {
      .top-nav { top: 8px; width: calc(100vw - 16px); padding-left: 12px; }
      .brand { font-size: 11px; }
      .source-button { display:none; }
      .mode-button { padding-inline: 9px; }
      .reading-root { width: calc(100vw - 24px); padding-top: 82px; }
      .report-slot { padding-block: 26px 48px; }
      .display-title { font-size: 32px; white-space: normal; }
      .visual-surface,.decision-card { padding: 20px; }
      .diagram-track { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
      .diagram-connector { display:none; }
      .diagram-card { min-height: 180px; }
      .page-foot { grid-template-columns: auto 1fr auto; }
      .page-foot .global-page { display:none; }
      .conclusion-board { grid-template-columns: 1fr; gap: 5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *,*::before,*::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
    @media print {
      @page { size: 13.333in 7.5in; margin: 0; }
      html,body { width: 13.333in; min-width: 13.333in; background: #09090a !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .scene-background,.scene-mask,.top-nav,.reading-root,.presentation-root,.source-drawer { display:none !important; }
      .print-root { display:block !important; }
      .print-page {
        width: 13.333in;
        height: 7.5in;
        break-after: page;
        page-break-after: always;
        overflow: hidden;
        background:
          linear-gradient(180deg,rgba(7,7,8,.72),rgba(7,7,8,.84)),
          var(--scene-image,none) center / cover no-repeat,
          radial-gradient(circle at 18% 8%,#3d4143 0,#202224 32%,#101112 68%,#080809 100%);
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .print-page .report-page {
        width: 100%;
        height: 100%;
        padding: .28in .34in .18in;
        grid-template-columns: minmax(0,1fr) 3.45in;
        grid-template-areas:
          "primary decision"
          "conclusion conclusion"
          "foot foot";
        grid-template-rows: minmax(0,1fr) auto auto;
        gap: .13in .24in;
      }
      .print-page .primary-column { min-height:0; gap:.08in; }
      .print-page .page-header { gap:.03in; }
      .print-page .display-title { font-size: 28px; }
      .print-page .section-label { display:none; }
      .print-page .primary-visual,.print-page .visual-surface,.print-page .media-figure { min-height:0; height:100%; }
      .print-page .visual-surface { padding:.15in; }
      .print-page .media-frame { min-height:0; }
      .print-page .media-frame img { min-height:0; height:100%; max-height:none; }
      .print-page .media-caption { padding:.06in .09in; font-size:8px; }
      .print-page .chart-shell { min-height:0; gap:.06in; }
      .print-page .decision-chart { min-height:1.8in; }
      .print-page .diagram-canvas { min-height:0; height:100%; gap:.08in; padding:.08in 0; }
      .print-page .diagram-track { gap:.06in; }
      .print-page .diagram-card { padding:.12in; border-radius:.14in; background:rgba(10,10,11,.62); }
      .print-page .diagram-card strong { font-size:12px; }
      .print-page .diagram-details { gap:.03in; padding-top:.03in; }
      .print-page .diagram-details span { font-size:8px; line-height:1.35; }
      .print-page .diagram-connector { flex-basis:.13in; }
      .print-page .decision-card { align-self:stretch; padding:.18in; gap:.11in; overflow:hidden; }
      .print-page .decision-question { font-size:18px; }
      .print-page .decision-takeaway { font-size:10px; line-height:1.5; }
      .print-page .decision-fact { padding:.06in .08in; }
      .print-page .decision-impact { padding-top:.07in; }
      .print-page .decision-impact p { font-size:9px; line-height:1.4; }
      .print-page .conclusion-board { padding:.08in .12in; }
      .print-page .conclusion-board strong { font-size:10px; }
      .print-page .page-foot { font-size:7px; }
    }
  </style>
</head>
<body data-mode="reading" data-glass-runtime="dds-v4">
  <div class="scene-background" aria-hidden="true"></div>
  <div class="scene-mask" aria-hidden="true"></div>

  <header class="top-nav" aria-label="报告导航">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span><span data-project-title>__DOCUMENT_TITLE__</span></div>
    <nav class="section-nav" data-section-nav aria-label="章节"></nav>
    <div class="mode-switch">
      <button class="source-button" type="button" data-open-sources>来源</button>
      <button class="mode-button is-active" type="button" data-mode="reading">阅读</button>
      <button class="mode-button" type="button" data-mode="presentation">演示</button>
    </div>
  </header>

  <main class="reading-root" data-page-stage aria-live="polite"></main>
  <section class="presentation-root" aria-label="16:9 演示">
    <div class="presentation-frame glass" data-presentation-frame></div>
  </section>

  <aside class="source-drawer glass" data-source-drawer aria-hidden="true">
    <div class="drawer-head"><h2>来源索引</h2><button class="drawer-close" type="button" data-close-sources aria-label="关闭">×</button></div>
    <div class="source-list" data-source-list></div>
  </aside>
  <div class="print-root" data-print-root aria-hidden="true"></div>

  <script id="dds-report-payload" type="application/json">__REPORT_METADATA__</script>
  __PAGE_CHUNKS__
  __LEGACY_MEDIA_MARKERS__
  <script>
  (() => {
    "use strict";

    const metadataNode = document.getElementById("dds-report-payload");
    const stage = document.querySelector("[data-page-stage]");
    const presentationFrame = document.querySelector("[data-presentation-frame]");
    const printRoot = document.querySelector("[data-print-root]");
    const sourceDrawer = document.querySelector("[data-source-drawer]");
    const sectionNav = document.querySelector("[data-section-nav]");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let metadata = {};
    let pages = [];
    let currentIndex = 0;
    let currentMode = "reading";
    let mounted = new Set();
    let observer = null;
    let wheelLockedUntil = 0;

    const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g,char => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[char]));
    const asArray = value => Array.isArray(value) ? value : [];
    const asObject = value => value && typeof value === "object" && !Array.isArray(value) ? value : {};
    const clamp = (value,min,max) => Math.max(min,Math.min(max,value));
    const text = (value,fallback="") => {
      const normalized = String(value ?? "").trim();
      return normalized || fallback;
    };
    const scoreOf = page => {
      const score = Number(asObject(page.confidence).score);
      return Number.isFinite(score) ? clamp(score,0,1) : 0;
    };
    const statusOf = page => text(page.unit_status || asObject(page.confidence).level,"not_assessable").toLowerCase();
    const statusLabel = status => ({
      ready:"结构通过",
      partial:"部分就绪",
      missing:"资料缺失",
      blocked:"决策阻断",
      not_assessable:"无法评定"
    }[status] || "待复核");
    const eligibilityLabel = value => ({
      validated_for_decision:"可用于决策",
      validated_for_report_delivery:"仅限报告交付",
      eligible:"可用于决策",
      not_eligible:"不可用于决策"
    }[text(value).toLowerCase()] || "未取得决策资格");
    const confidenceLabel = value => ({
      high:"高",
      medium:"中",
      low:"低",
      insufficient:"不足",
      not_assessable:"无法评定"
    }[text(value).toLowerCase()] || "未评定");
    const boundaryLabel = value => {
      const normalized = text(value).toLowerCase();
      if (normalized === "source_admission_policy") return "仅用于方向研判，不能替代正式市场或法定依据";
      return text(value,"仅在当前证据、地域和时间边界内使用");
    };
    const sourceTypeLabel = value => ({
      official_web:"政府公开信息",
      government_web:"政府公开信息",
      official_planning_document:"政府公开信息",
      client_provided_material:"甲方项目资料",
      corporate_official:"企业官方信息",
      news_media:"媒体线索",
      social_media:"公开社媒线索",
      social_observation:"公开社媒线索",
      internal_case_library:"内部案例库",
      archlib_case_evidence:"内部案例库",
      transaction_record:"成交与登记数据",
      customer_research:"客群调研资料"
    }[text(value).toLowerCase()] || "来源资料");
    const pageSources = page => [...new Set([
      ...asArray(page.source_refs),
      ...asArray(page.blocks).flatMap(block => asArray(block?.source_refs)),
      ...asArray(page.chart_specs).flatMap(chart => asArray(chart?.source_refs)),
      ...asArray(page.diagram_specs).flatMap(diagram => asArray(diagram?.source_refs))
    ].map(String).filter(Boolean))];
    const safeImage = value => typeof value === "string" && /^data:image\/(?:png|jpe?g|webp|avif|gif|svg\+xml);base64,/i.test(value);

    function parsePayload() {
      metadata = JSON.parse(metadataNode?.textContent || "{}");
      pages = [...document.querySelectorAll("script[data-page-chunk]")]
        .sort((a,b) => Number(a.dataset.start) - Number(b.dataset.start))
        .flatMap(node => JSON.parse(node.textContent || "[]"));
    }

    function setScene() {
      const image = pages.flatMap(page => asArray(page.blocks)).find(block => safeImage(block?.src));
      if (!image) return;
      document.documentElement.style.setProperty("--scene-image",`url("${String(image.src).replaceAll('"','%22')}")`);
    }

    function renderMetrics(block) {
      let items = asArray(block.metrics || block.items || block.values);
      if (!items.length && (block.value !== undefined || block.label)) items = [block];
      if (!items.length) return "";
      return `<div class="metric-grid">${items.map(item => {
        const value = typeof item === "object" ? item : {value:item};
        return `<div class="metric solid-plate"><span>${escapeHTML(value.label || value.name || block.title || "指标")}</span><strong>${escapeHTML(value.value ?? value.metric ?? "—")}</strong>${value.note || value.unit ? `<small>${escapeHTML([value.unit,value.note].filter(Boolean).join(" · "))}</small>` : ""}</div>`;
      }).join("")}</div>`;
    }

    function renderTable(block) {
      const rows = asArray(block.rows || block.data);
      const columns = asArray(block.columns);
      if (!rows.length) return "";
      const keys = columns.length
        ? columns.map(column => typeof column === "object" ? column.field || column.key : column)
        : Object.keys(asObject(rows[0])).slice(0,6);
      const labels = columns.length
        ? columns.map(column => typeof column === "object" ? column.label || column.title || column.field : column)
        : keys;
      return `<table class="data-table"><thead><tr>${labels.map(label => `<th>${escapeHTML(label)}</th>`).join("")}</tr></thead><tbody>${rows.slice(0,10).map(row => `<tr>${keys.map(key => `<td>${escapeHTML(asObject(row)[key] ?? "—")}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }

    function renderItems(block) {
      const items = asArray(block.items || block.actions || block.steps || block.values);
      if (!items.length) return "";
      return `<div class="item-list">${items.slice(0,10).map(item => {
        const value = typeof item === "object" ? item : {text:item};
        return `<div class="item-row solid-plate">${escapeHTML(value.text || value.title || value.action || value.label || JSON.stringify(value))}</div>`;
      }).join("")}</div>`;
    }

    function renderBlock(block) {
      const kind = text(block?.type).toLowerCase();
      if (["image","media"].includes(kind)) {
        if (!safeImage(block.src || block.data_uri)) return "";
        const contain = text(block.orientation).toLowerCase() === "contain" ? " is-contain" : "";
        return `<figure class="media-figure"><div class="media-frame${contain}"><img src="${escapeHTML(block.src || block.data_uri)}" alt="${escapeHTML(block.alt || block.title || "项目图像")}" loading="eager" decoding="async"></div>${block.title ? `<figcaption class="media-caption solid-plate">${escapeHTML(block.title)}</figcaption>` : ""}</figure>`;
      }
      if (["metric","metrics"].includes(kind)) return renderMetrics(block);
      if (kind === "table") return renderTable(block);
      if (["decision_actions","reasoning_chain","case_mechanism","market_outcome_case"].includes(kind)) return renderItems(block);
      if (["narrative","text","callout"].includes(kind)) return `<p class="narrative">${escapeHTML(block.text || block.body || block.title || "")}</p>`;
      if (kind === "gap") return "";
      return block?.text ? `<p class="narrative">${escapeHTML(block.text)}</p>` : renderItems(block);
    }

    function chartRows(spec) {
      if (asArray(spec.series).length) return spec.series.map(item => typeof item === "object" ? item : {label:String(item),value:Number(item)});
      return asArray(spec.data).map(item => typeof item === "object" ? item : {label:String(item),value:Number(item)});
    }

    function renderChart(spec) {
      const rows = chartRows(spec).filter(row => Number.isFinite(Number(row.value))).slice(0,9);
      if (!rows.length) return "";
      const diverging = text(spec.type).toLowerCase() === "diverging_bar" || rows.some(row => Number(row.value) < 0);
      const width = 800;
      const rowHeight = 45;
      const height = Math.max(280,rows.length * rowHeight + 58);
      const labelWidth = 235;
      const plotWidth = width - labelWidth - 70;
      const maxAbs = Math.max(...rows.map(row => Math.abs(Number(row.value))),1);
      const zero = diverging ? labelWidth + plotWidth / 2 : labelWidth;
      const scale = diverging ? (plotWidth / 2 - 12) / maxAbs : (plotWidth - 18) / maxAbs;
      const bars = rows.map((row,index) => {
        const value = Number(row.value);
        const y = 36 + index * rowHeight;
        const barWidth = Math.max(2,Math.abs(value) * scale);
        const x = diverging && value < 0 ? zero - barWidth : zero;
        const cls = diverging ? (value < 0 ? "chart-bar-negative" : "chart-bar-positive") : "chart-bar-data";
        const valueX = diverging && value < 0 ? x - 8 : x + barWidth + 8;
        const anchor = diverging && value < 0 ? "end" : "start";
        return `<text class="chart-label" x="0" y="${y + 15}">${escapeHTML(text(row.label || row.name,"未命名"))}</text><rect class="${cls}" x="${x}" y="${y}" width="${barWidth}" height="19" rx="7"></rect><text class="chart-value" text-anchor="${anchor}" x="${valueX}" y="${y + 15}">${escapeHTML(value)}</text>`;
      }).join("");
      const axis = diverging ? `<line class="chart-axis" x1="${zero}" y1="22" x2="${zero}" y2="${height - 22}"></line>` : `<line class="chart-axis" x1="${labelWidth}" y1="22" x2="${labelWidth}" y2="${height - 22}"></line>`;
      return `<div class="visual-surface glass chart-shell"><div class="chart-head"><h2>${escapeHTML(spec.title || "决策图")}</h2><span>${escapeHTML([spec.units,spec.time_window].filter(Boolean).join(" · "))}</span></div><svg class="decision-chart" role="img" aria-label="${escapeHTML(spec.a11y_summary || spec.title || "数据图表")}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">${axis}${bars}</svg><p class="chart-note">${escapeHTML(spec.source_note || spec.limitations || "图表与来源、口径同时阅读。")}</p></div>`;
    }

    function renderDiagram(spec) {
      const nodes = asArray(spec.program_blocks || spec.nodes || spec.geometry);
      if (!nodes.length) return "";
      const sequential = asArray(spec.relations).length > 0;
      const dense = nodes.length > 4;
      const cards = nodes.slice(0,8).map((node,index) => {
        const value = typeof node === "object" ? node : {label:node};
        const details = asArray(value.details || value.lines || value.annotations);
        const fallback = value.annotation || value.note || value.value;
        if (!details.length && fallback) details.push(fallback);
        const detailMarkup = details.map(detail => {
          const item = typeof detail === "object" ? detail.text || detail.label || detail.value : detail;
          const risk = String(item || "").startsWith("退出") ? " is-risk" : "";
          return `<span class="${risk.trim()}">${escapeHTML(item)}</span>`;
        }).join("");
        const card = `<div class="diagram-card glass"><span class="diagram-code">${escapeHTML(value.code || value.kicker || value.id || String(index + 1).padStart(2,"0"))}</span><strong>${escapeHTML(value.label || value.title || value.id || "关系节点")}</strong><div class="diagram-details">${detailMarkup}</div></div>`;
        const connector = sequential && index < Math.min(nodes.length,8) - 1 ? `<span class="diagram-connector" aria-hidden="true"></span>` : "";
        return card + connector;
      }).join("");
      return `<div class="diagram-canvas"><div class="chart-head"><h2>${escapeHTML(spec.title || "空间关系")}</h2><span>${escapeHTML(spec.precision_label || spec.required_label || "非比例概念关系图")}</span></div><div class="diagram-track${sequential ? " is-sequential" : ""}${dense ? " is-dense" : ""}">${cards}</div><p class="chart-note">${escapeHTML(spec.source_note || spec.limitations || "概念关系与来源边界同时阅读。")}</p></div>`;
    }

    function renderPrimary(page) {
      const chart = asArray(page.chart_specs)[0];
      if (chart) return renderChart(chart);
      const diagram = asArray(page.diagram_specs)[0];
      if (diagram) return renderDiagram(diagram);
      const blocks = asArray(page.blocks);
      const image = blocks.find(block => ["image","media"].includes(text(block?.type).toLowerCase()) && safeImage(block.src || block.data_uri));
      if (image) return renderBlock(image);
      const body = blocks.map(renderBlock).filter(Boolean).join("");
      return `<div class="visual-surface glass">${body || `<p class="narrative">本页没有形成可发送的主要视觉。</p>`}</div>`;
    }

    function renderDecisionFacts(page) {
      const refs = pageSources(page);
      const confidence = asObject(page.confidence);
      const facts = [
        ["结构状态 / 决策资格",`${statusLabel(statusOf(page))} / ${eligibilityLabel(confidence.decision_eligibility)}`],
        ["证据置信",`${Math.round(scoreOf(page) * 100)}% · ${confidenceLabel(confidence.level)}`],
        ["来源范围",refs.length ? `${refs.length} 项可追溯来源` : "无合格来源"],
        ["使用边界",boundaryLabel(page.decision_gate || confidence.basis)]
      ];
      return facts.map(([label,value]) => `<div class="decision-fact solid-plate"><span>${escapeHTML(label)}</span><strong>${escapeHTML(value)}</strong></div>`).join("");
    }

    function renderPage(page,index) {
      const sources = pageSources(page);
      const status = statusOf(page);
      const pageCode = text(page.display_code || page.page_code,`P${index + 1}`);
      const title = text(page.display_title || page.title,"未命名判断");
      const question = text(page.decision_question,"本页需要回答什么决策问题？");
      const takeaway = text(page.takeaway,"当前证据不足以形成可发送结论。");
      const impact = text(page.decision_impact || page.recommendation || page.decision_gate,"保留证据边界，并明确下一步动作。");
      const primary = renderPrimary(page);
      return `<article class="report-page" data-page-id="${escapeHTML(page.page_id || index)}">
        <section class="primary-column">
          <header class="page-header">
            <p class="display-code">${escapeHTML(pageCode)}</p>
            <h1 class="display-title">${escapeHTML(title)}</h1>
            <p class="section-label">${escapeHTML(page.section_title || page.section_group_label || "项目研判")}</p>
          </header>
          <div class="primary-visual">${primary}</div>
        </section>
        <aside class="decision-card glass">
          <div class="decision-kicker">本页判断</div>
          <h2 class="decision-question">${escapeHTML(question)}</h2>
          <p class="decision-takeaway">${escapeHTML(takeaway)}</p>
          <div class="decision-facts">${renderDecisionFacts(page)}</div>
          <div class="decision-impact"><span>对项目的影响 / 下一步</span><p>${escapeHTML(impact)}</p></div>
        </aside>
        <div class="conclusion-board solid-plate"><span>核心结论</span><strong>${escapeHTML(takeaway)}</strong></div>
        <footer class="page-foot">
          <span class="status-chip" data-status="${escapeHTML(status)}">${escapeHTML(statusLabel(status))}</span>
          <span class="source-summary">${sources.length ? `来源：${sources.length} 项 · 详见来源索引` : "未形成来源闭包"}</span>
          <span>${escapeHTML(pageCode)}</span>
          <span class="global-page">${index + 1} / ${pages.length}</span>
        </footer>
      </article>`;
    }

    function pageId(index) {
      return text(pages[index]?.page_id,String(index));
    }

    function updateHash() {
      history.replaceState(null,"",`#page=${encodeURIComponent(pageId(currentIndex))}`);
    }

    function syncNavigation() {
      [...sectionNav.querySelectorAll("[data-nav-index]")].forEach(button => {
        const start = Number(button.dataset.navIndex);
        const next = Number(button.dataset.nextIndex || pages.length);
        button.classList.toggle("is-active",currentIndex >= start && currentIndex < next);
      });
      document.querySelectorAll("[data-mode]").forEach(button => button.classList.toggle("is-active",button.dataset.mode === currentMode));
    }

    function mountWindow(center) {
      const wanted = new Set();
      for (let index=Math.max(0,center-3);index<=Math.min(pages.length-1,center+3);index+=1) wanted.add(index);
      document.querySelectorAll(".report-slot[data-index]").forEach(slot => {
        const index = Number(slot.dataset.index);
        if (wanted.has(index) && !mounted.has(index)) {
          slot.innerHTML = renderPage(pages[index],index);
          mounted.add(index);
        } else if (!wanted.has(index) && mounted.has(index)) {
          const height = Math.max(760,slot.getBoundingClientRect().height);
          slot.style.minHeight = `${height}px`;
          slot.innerHTML = `<div class="slot-placeholder" aria-hidden="true">${escapeHTML(pages[index]?.display_code || "")}</div>`;
          mounted.delete(index);
        }
      });
      stage.dataset.mountedPages = String(mounted.size);
    }

    function setCurrent(index,{hash=true}={}) {
      currentIndex = clamp(Number(index) || 0,0,Math.max(0,pages.length-1));
      mountWindow(currentIndex);
      if (currentMode === "presentation") presentationFrame.innerHTML = renderPage(pages[currentIndex],currentIndex);
      if (hash) updateHash();
      syncNavigation();
      return currentIndex;
    }

    function navigate(index,{smooth=true}={}) {
      setCurrent(index);
      if (currentMode === "reading") {
        document.querySelector(`.report-slot[data-index="${currentIndex}"]`)?.scrollIntoView({behavior:smooth && !reducedMotion ? "smooth" : "instant",block:"start"});
      }
    }

    function setMode(mode) {
      const next = mode === "presentation" ? "presentation" : "reading";
      if (next === currentMode) return currentMode;
      currentMode = next;
      document.body.dataset.mode = currentMode;
      if (currentMode === "presentation") {
        presentationFrame.innerHTML = renderPage(pages[currentIndex],currentIndex);
      } else {
        requestAnimationFrame(() => document.querySelector(`.report-slot[data-index="${currentIndex}"]`)?.scrollIntoView({behavior:"auto",block:"start"}));
      }
      syncNavigation();
      return currentMode;
    }

    function move(delta) {
      navigate(clamp(currentIndex + Number(delta || 0),0,pages.length-1),{smooth:false});
      return currentIndex;
    }

    function renderNavigation() {
      const sections = asArray(metadata.section_index);
      const entries = sections.length ? sections : asArray(metadata.chapter_index);
      const visible = entries.slice(0,8);
      sectionNav.innerHTML = visible.map((entry,index) => {
        const next = Number(visible[index + 1]?.start_index ?? pages.length);
        return `<button class="nav-button" type="button" data-nav-index="${Number(entry.start_index || 0)}" data-next-index="${next}">${escapeHTML(entry.display_code || entry.section_id || entry.title || `章节${index + 1}`)}</button>`;
      }).join("");
      sectionNav.querySelectorAll("[data-nav-index]").forEach(button => button.addEventListener("click",() => navigate(Number(button.dataset.navIndex),{smooth:false})));
      sectionNav.setAttribute("data-section-nav","");
    }

    function renderSources() {
      const registry = asArray(metadata.source_registry);
      const referenced = new Set(pages.flatMap(pageSources));
      const rows = registry.filter(source => referenced.has(String(source.source_id || source.id)));
      document.querySelector("[data-source-list]").innerHTML = (rows.length ? rows : [...referenced].map(id => ({source_id:id,title:id}))).map(source => {
        const id = text(source.source_id || source.id,"未登记");
        const sourceType = sourceTypeLabel(source.source_type || source.type);
        const locator = text(source.locator || source.url);
        const descriptor = locator ? `${sourceType} · ${locator}` : sourceType;
        return `<div class="source-entry solid-plate"><strong>${escapeHTML(source.title || source.name || id)}</strong><span>${escapeHTML(id)}</span><span>${escapeHTML(descriptor)}</span></div>`;
      }).join("") || `<div class="source-entry solid-plate"><strong>无可展示来源</strong><span>报告尚未形成来源闭包。</span></div>`;
    }

    function preparePrint() {
      printRoot.innerHTML = pages.map((page,index) => `<section class="print-page">${renderPage(page,index)}</section>`).join("");
      printRoot.setAttribute("aria-hidden","false");
      return pages.length;
    }

    function renderFallback(code,detail="") {
      stage.innerHTML = `<section class="runtime-fallback glass" data-runtime-error role="alert"><h1>报告暂时无法打开</h1><p>${escapeHTML(code)}${detail ? ` · ${escapeHTML(detail)}` : ""}</p></section>`;
      stage.dataset.runtimeReady = "error";
      stage.dataset.runtimeDiagnostic = code;
    }

    function boot() {
      parsePayload();
      if (!pages.length) {
        renderFallback("empty_manifest","报告没有可展示页面");
        return;
      }
      setScene();
      renderNavigation();
      renderSources();
      stage.innerHTML = pages.map((page,index) => `<section class="report-slot" data-index="${index}" id="page-${escapeHTML(pageId(index))}"><div class="slot-placeholder" aria-hidden="true">${escapeHTML(page.display_code || "")}</div></section>`).join("");
      const hashPage = new URLSearchParams(location.hash.replace(/^#/,"")).get("page");
      const hashIndex = pages.findIndex(page => String(page.page_id) === hashPage);
      currentIndex = hashIndex >= 0 ? hashIndex : 0;
      mountWindow(currentIndex);
      observer = new IntersectionObserver(entries => {
        if (currentMode !== "reading") return;
        const candidate = entries.filter(entry => entry.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!candidate) return;
        const index = Number(candidate.target.dataset.index);
        if (index !== currentIndex) setCurrent(index);
      },{rootMargin:"-18% 0px -48% 0px",threshold:[.05,.25,.5]});
      stage.querySelectorAll(".report-slot").forEach(slot => observer.observe(slot));
      setCurrent(currentIndex,{hash:false});
      requestAnimationFrame(() => document.querySelector(`.report-slot[data-index="${currentIndex}"]`)?.scrollIntoView({behavior:"auto",block:"start"}));
      addEventListener("beforeprint",preparePrint);
      document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click",() => setMode(button.dataset.mode)));
      document.querySelector("[data-open-sources]").addEventListener("click",() => {
        sourceDrawer.classList.add("is-open");
        sourceDrawer.setAttribute("aria-hidden","false");
      });
      document.querySelector("[data-close-sources]").addEventListener("click",() => {
        sourceDrawer.classList.remove("is-open");
        sourceDrawer.setAttribute("aria-hidden","true");
      });
      addEventListener("keydown",event => {
        if (event.key === "Escape" && sourceDrawer.classList.contains("is-open")) {
          sourceDrawer.classList.remove("is-open");
          sourceDrawer.setAttribute("aria-hidden","true");
          return;
        }
        if (currentMode !== "presentation") return;
        if (event.key === "ArrowRight" || event.key === "PageDown") { event.preventDefault(); move(1); }
        if (event.key === "ArrowLeft" || event.key === "PageUp") { event.preventDefault(); move(-1); }
        if (event.key === "Escape") setMode("reading");
      });
      addEventListener("wheel",event => {
        if (currentMode !== "presentation" || Math.abs(event.deltaY) < 40) return;
        event.preventDefault();
        const now = performance.now();
        if (now < wheelLockedUntil) return;
        wheelLockedUntil = now + 420;
        move(event.deltaY > 0 ? 1 : -1);
      },{passive:false});
      presentationFrame.addEventListener("click",event => {
        if (event.target.closest("button,a")) return;
        move(event.clientX > innerWidth / 2 ? 1 : -1);
      });
      window.DDSReportRuntime = Object.freeze({
        apiVersion:"dds.browser-qa-runtime/4.0",
        documentData:Object.freeze({...metadata,page_chunks:{},chunks:{}}),
        pages:Object.freeze(pages),
        state:{
          get activeIndex(){ return currentIndex; },
          get activeMode(){ return currentMode; },
          get mounted(){ return new Set(mounted); }
        },
        setActiveIndex:index => { navigate(index,{smooth:false}); return currentIndex; },
        preparePrint
      });
      window.DDSReportModes = Object.freeze({
        setMode,
        next:() => move(1),
        previous:() => move(-1)
      });
      stage.dataset.runtimeReady = "true";
      syncNavigation();
    }

    try {
      boot();
    } catch (error) {
      const diagnostic = error instanceof Error ? error.message : String(error);
      renderFallback("runtime_initialization_failed",diagnostic.slice(0,500));
      console.error("DDS runtime initialization failed",error);
    }
  })();
  </script>
</body>
</html>
